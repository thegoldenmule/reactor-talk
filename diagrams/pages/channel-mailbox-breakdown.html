<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <style>
    /* Rows are mailbox kinds, named once in the left column so each label governs both
       Reactors at once. Columns are the two Reactors, separated by the single channel they
       share. Operations keep their origin colour — cyan for A, green for B — so the other
       side's ops sitting in an inbox read at a glance without needing delivery arrows. */
    .frame { max-width: 1200px; }
    .card { height: auto; }
    .card-body { flex: none; }

    .wire {
      position: relative;
      display: grid;
      grid-template-columns: 150px 1fr 46px 1fr;
      grid-template-rows: 44px 112px 112px 112px;
      row-gap: var(--space-md);
      column-gap: var(--space-lg);
      align-items: stretch;
    }

    /* Column 1: the mailbox kind, stated once per row */
    .kind {
      grid-column: 1;
      align-self: center;
      text-align: right;
    }
    /* Every item is placed explicitly. Mixing auto-placed items with ones that have a
       definite column (.kind, .channel) walks the auto cursor into the channel column,
       which is what put Reactor B's mailboxes inside the divider. */
    .r-head   { grid-row: 1; }
    .r-outbox { grid-row: 2; }
    .r-inbox  { grid-row: 3; }
    .r-dead   { grid-row: 4; }
    .c-a      { grid-column: 2; }
    .c-b      { grid-column: 4; }
    .kind-name {
      font-size: 17px;
      font-weight: var(--font-weight-bold);
      color: var(--text-primary);
      letter-spacing: -0.01em;
    }
    .kind.dead .kind-name { color: #e05252; }

    /* Reactor headers */
    .side-head {
      border-radius: var(--radius-md);
      padding: var(--space-sm) var(--space-md);
      font-size: 17px;
      font-weight: var(--font-weight-bold);
      text-align: center;
      border: 1px solid;
    }
    .side-head.a { color: var(--accent-cyan);  border-color: var(--accent-cyan);  background: var(--accent-cyan-bg); }
    .side-head.b { color: var(--accent-green); border-color: var(--accent-green); background: var(--accent-green-bg); }

    /* The one channel the pair shares, running the full height between them */
    .channel {
      grid-column: 3;
      grid-row: 1 / 5;
      justify-self: center;
      width: 100%;
      display: flex;
      align-items: flex-start;   /* keep the label clear of the crossing arrows */
      justify-content: center;
      padding-top: 26px;
      border-left: 1px dashed var(--border-glass);
      border-right: 1px dashed var(--border-glass);
    }
    .channel span {
      writing-mode: vertical-rl;
      text-orientation: mixed;
      font-size: 11px;
      font-weight: var(--font-weight-semibold);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    /* Outbox -> the other side's inbox, drawn as two diagonals that cross inside the
       channel. At the 1200px design width the content box is 1088 and the columns compute
       to 150 / 410 / 46 / 410 with 24px gaps, so this SVG is exactly the 914px from the
       start of Reactor A's column to the end of Reactor B's: viewBox units are CSS pixels
       1:1, and the crossing lands at x=457, the channel's centre. */
    /* Overlay, not a grid item — absolutely positioned children are out of flow, so the
       arrows add no vertical space. With the rows fixed above, .wire is exactly 1088x428 at
       the design width, so the viewBox maps 1:1 and the endpoints can be stated in pixels:
       x=584 is the right edge of Reactor A's column, x=678 the left edge of Reactor B's,
       y=116 and y=244 the vertical centres of the outbox and inbox rows. */
    .cross {
      position: absolute;
      left: 0;
      top: 0;
      pointer-events: none;
      overflow: visible;
    }
    .cross line { stroke-width: 2; }
    .cross .a-line { stroke: var(--accent-cyan); }
    .cross .b-line { stroke: var(--accent-green); }
    .cross .a-head { fill: var(--accent-cyan); }
    .cross .b-head { fill: var(--accent-green); }

    /* Mailbox contents */
    .mb {
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      background: rgba(0, 0, 0, 0.25);
      padding: var(--space-md);
      display: flex;
      align-items: center;
    }
    .ops { display: flex; gap: var(--space-sm); width: 100%; }
    .op {
      flex: 1;
      border: 1px solid;
      border-radius: var(--radius-sm, 8px);
      padding: 8px 4px;
      text-align: center;
      font-size: 15px;
      font-weight: var(--font-weight-semibold);
      line-height: 1.15;
    }
    .op.a { color: var(--accent-cyan);  border-color: var(--accent-cyan);  background: var(--accent-cyan-bg); }
    .op.b { color: var(--accent-green); border-color: var(--accent-green); background: var(--accent-green-bg); }
    .op.failed { color: #e05252; border-color: #e05252; background: rgba(224, 82, 82, 0.08); }
    .op .ts {
      display: block;
      font-size: 11px;
      font-weight: var(--font-weight-medium);
      color: var(--text-muted);
      margin-top: 3px;
    }
    .op .hash {
      display: block;
      font-family: var(--font-mono, 'SF Mono', 'Fira Code', monospace);
      font-size: 10px;
      font-weight: var(--font-weight-medium);
      color: var(--text-muted);
      opacity: 0.75;
    }
    .empty {
      width: 100%;
      font-size: 12px;
      color: var(--text-muted);
      text-align: center;
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <div class="frame">
    <div class="card">
      <div class="card-body">
        <div class="wire">

          <!-- row 1: the two Reactors, and the channel between them -->
          <div></div>
          <div class="side-head a r-head c-a">Reactor A</div>
          <div class="channel r-head"><span>one channel</span></div>
          <div class="side-head b r-head c-b">Reactor B</div>

          <!-- row 2 -->
          <div class="kind r-outbox">
            <div class="kind-name">Outbox</div>
          </div>
          <div class="mb r-outbox c-a">
            <div class="ops">
              <div class="op a">A&#8323;<span class="ts">t=12</span><span class="hash">e9c4</span></div>
              <div class="op a">A&#8324;<span class="ts">t=18</span><span class="hash">f2a8</span></div>
              <div class="op a">A&#8325;<span class="ts">t=27</span><span class="hash">c1d9</span></div>
            </div>
          </div>
          <div class="mb r-outbox c-b">
            <div class="ops">
              <div class="op b">B&#8323;<span class="ts">t=14</span><span class="hash">a8f5</span></div>
              <div class="op b">B&#8324;<span class="ts">t=21</span><span class="hash">e3d7</span></div>
              <div class="op b">B&#8325;<span class="ts">t=30</span><span class="hash">f7b1</span></div>
            </div>
          </div>

          <!-- row: each side holds what the other sent -->
          <div class="kind r-inbox">
            <div class="kind-name">Inbox</div>
          </div>
          <div class="mb r-inbox c-a">
            <div class="ops">
              <div class="op b">B&#8324;<span class="ts">t=21</span><span class="hash">e3d7</span></div>
              <div class="op b">B&#8325;<span class="ts">t=30</span><span class="hash">f7b1</span></div>
            </div>
          </div>
          <div class="mb r-inbox c-b">
            <div class="ops">
              <div class="op a">A&#8323;<span class="ts">t=12</span><span class="hash">e9c4</span></div>
              <div class="op a">A&#8324;<span class="ts">t=18</span><span class="hash">f2a8</span></div>
              <div class="op a">A&#8325;<span class="ts">t=27</span><span class="hash">c1d9</span></div>
            </div>
          </div>

          <!-- row 4: B3 could not be applied, so it never reached A's inbox -->
          <div class="kind dead r-dead">
            <div class="kind-name">Dead letter</div>
          </div>
          <div class="mb r-dead c-a">
            <div class="ops">
              <div class="op failed">B&#8323; &#10005;<span class="ts">t=14</span><span class="hash">a8f5</span></div>
            </div>
          </div>
          <div class="mb r-dead c-b">
            <div class="empty">empty</div>
          </div>

          <!-- right edge of each outbox, across the channel, to the other side's inbox -->
          <svg class="cross" width="1088" height="428" viewBox="0 0 1088 428" aria-hidden="true">
            <line class="a-line" x1="584" y1="116" x2="670" y2="234" />
            <polygon class="a-head" points="678,244 665.7,235.7 673.7,229.8" />
            <line class="b-line" x1="678" y1="116" x2="592" y2="234" />
            <polygon class="b-head" points="584,244 588.3,229.8 596.3,235.7" />
          </svg>

        </div>
      </div>
    </div>
  </div>
</body>
</html>
