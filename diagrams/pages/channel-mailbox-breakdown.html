<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <style>
    /* One channel between two Reactors. Reactor A owns the whole left column, Reactor B the
       whole right, and the rows line up so each mailbox faces its counterpart: A's outbox
       delivers into B's inbox, B's outbox into A's inbox. Operations keep their origin
       colour — cyan for A, green for B — so an op sitting in the other side's inbox is
       obvious at a glance. */
    .frame { max-width: 1200px; }
    .card { height: auto; }
    .card-body { flex: none; }

    .wire {
      display: grid;
      grid-template-columns: 1fr 210px 1fr;
      row-gap: var(--space-md);
      column-gap: var(--space-lg);
      align-items: stretch;
    }

    /* Reactor headers */
    .side-head {
      border-radius: var(--radius-md);
      padding: var(--space-sm) var(--space-md);
      font-size: 17px;
      font-weight: var(--font-weight-bold);
      text-align: center;
      border: 1px solid;
    }
    .side-head.a { color: var(--accent-cyan);  border-color: var(--accent-cyan);  background: var(--accent-cyan-bg); }
    .side-head.b { color: var(--accent-green); border-color: var(--accent-green); background: var(--accent-green-bg); }
    .ch-head {
      align-self: center;
      text-align: center;
      font-size: 12px;
      font-weight: var(--font-weight-semibold);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-muted);
    }

    /* Mailboxes */
    .mb {
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      background: rgba(0, 0, 0, 0.25);
      padding: var(--space-sm) var(--space-md) var(--space-md);
    }
    .mb-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: var(--space-sm);
    }
    .mb-name {
      font-size: 14px;
      font-weight: var(--font-weight-semibold);
      color: var(--text-primary);
    }
    .fifo {
      font-size: 10px;
      font-weight: var(--font-weight-semibold);
      letter-spacing: 0.08em;
      color: var(--text-muted);
    }
    .mb.dead .mb-name { color: #e05252; }

    /* Operation chips */
    .ops { display: flex; gap: var(--space-sm); }
    .op {
      flex: 1;
      border: 1px solid;
      border-radius: var(--radius-sm, 8px);
      padding: 7px 4px;
      text-align: center;
      font-size: 15px;
      font-weight: var(--font-weight-semibold);
      line-height: 1.15;
    }
    .op.a { color: var(--accent-cyan);  border-color: var(--accent-cyan);  background: var(--accent-cyan-bg); }
    .op.b { color: var(--accent-green); border-color: var(--accent-green); background: var(--accent-green-bg); }
    .op.failed { color: #e05252; border-color: #e05252; background: rgba(224, 82, 82, 0.08); }
    .op .ts {
      display: block;
      font-size: 11px;
      font-weight: var(--font-weight-medium);
      color: var(--text-muted);
      margin-top: 3px;
    }
    .op .hash {
      display: block;
      font-family: var(--font-mono, 'SF Mono', 'Fira Code', monospace);
      font-size: 10px;
      font-weight: var(--font-weight-medium);
      color: var(--text-muted);
      opacity: 0.75;
    }
    .empty {
      font-size: 12px;
      color: var(--text-muted);
      text-align: center;
      padding: 14px 0;
      opacity: 0.7;
    }

    /* Channel arrows, one per mailbox row */
    .ch {
      align-self: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .ch-label {
      font-size: 11px;
      font-weight: var(--font-weight-semibold);
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .ch-line { width: 150px; height: 2px; position: relative; }
    .ch-line.right { background: var(--accent-cyan); }
    .ch-line.right::after {
      content: ''; position: absolute; left: 100%; top: 50%; transform: translateY(-50%);
      border-top: 6px solid transparent; border-bottom: 6px solid transparent;
      border-left: 9px solid var(--accent-cyan);
    }
    .ch-line.left { background: var(--accent-green); }
    .ch-line.left::before {
      content: ''; position: absolute; right: 100%; top: 50%; transform: translateY(-50%);
      border-top: 6px solid transparent; border-bottom: 6px solid transparent;
      border-right: 9px solid var(--accent-green);
    }
  </style>
</head>
<body>
  <div class="frame">
    <div class="card">
      <div class="card-body">
        <div class="wire">

          <!-- row 1: who owns each side -->
          <div class="side-head a">Reactor A</div>
          <div class="ch-head">one channel</div>
          <div class="side-head b">Reactor B</div>

          <!-- row 2: A's outbox delivers into B's inbox -->
          <div class="mb">
            <div class="mb-head"><span class="mb-name">Outbox</span><span class="fifo">FIFO</span></div>
            <div class="ops">
              <div class="op a">A&#8323;<span class="ts">t=12</span><span class="hash">e9c4</span></div>
              <div class="op a">A&#8324;<span class="ts">t=18</span><span class="hash">f2a8</span></div>
              <div class="op a">A&#8325;<span class="ts">t=27</span><span class="hash">c1d9</span></div>
            </div>
          </div>
          <div class="ch">
            <div class="ch-label">deliver</div>
            <div class="ch-line right"></div>
          </div>
          <div class="mb">
            <div class="mb-head"><span class="mb-name">Inbox</span><span class="fifo">FIFO</span></div>
            <div class="ops">
              <div class="op a">A&#8323;<span class="ts">t=12</span><span class="hash">e9c4</span></div>
              <div class="op a">A&#8324;<span class="ts">t=18</span><span class="hash">f2a8</span></div>
              <div class="op a">A&#8325;<span class="ts">t=27</span><span class="hash">c1d9</span></div>
            </div>
          </div>

          <!-- row 3: B's outbox delivers into A's inbox — B3 never arrives -->
          <div class="mb">
            <div class="mb-head"><span class="mb-name">Inbox</span><span class="fifo">FIFO</span></div>
            <div class="ops">
              <div class="op b">B&#8324;<span class="ts">t=21</span><span class="hash">e3d7</span></div>
              <div class="op b">B&#8325;<span class="ts">t=30</span><span class="hash">f7b1</span></div>
            </div>
          </div>
          <div class="ch">
            <div class="ch-label">deliver</div>
            <div class="ch-line left"></div>
          </div>
          <div class="mb">
            <div class="mb-head"><span class="mb-name">Outbox</span><span class="fifo">FIFO</span></div>
            <div class="ops">
              <div class="op b">B&#8323;<span class="ts">t=14</span><span class="hash">a8f5</span></div>
              <div class="op b">B&#8324;<span class="ts">t=21</span><span class="hash">e3d7</span></div>
              <div class="op b">B&#8325;<span class="ts">t=30</span><span class="hash">f7b1</span></div>
            </div>
          </div>

          <!-- row 4: what could not be applied -->
          <div class="mb dead">
            <div class="mb-head"><span class="mb-name">Dead letter</span><span class="fifo">FIFO</span></div>
            <div class="ops">
              <div class="op failed">B&#8323; &#10005;<span class="ts">t=14</span><span class="hash">a8f5</span></div>
            </div>
          </div>
          <div class="ch"></div>
          <div class="mb dead">
            <div class="mb-head"><span class="mb-name">Dead letter</span><span class="fifo">FIFO</span></div>
            <div class="empty">empty</div>
          </div>

        </div>
      </div>
    </div>
  </div>
</body>
</html>
