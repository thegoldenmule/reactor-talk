<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <style>
    /* Rows are mailbox kinds, named once in the left column so each label governs both
       Reactors at once. Columns are the two Reactors, separated by the single channel they
       share. Operations keep their origin colour — cyan for A, green for B — so the other
       side's ops sitting in an inbox read at a glance without needing delivery arrows. */
    .frame { max-width: 1200px; }
    .card { height: auto; }
    .card-body { flex: none; }

    .wire {
      display: grid;
      grid-template-columns: 150px 1fr 132px 1fr;
      row-gap: var(--space-md);
      column-gap: var(--space-lg);
      align-items: stretch;
    }

    /* Column 1: the mailbox kind, stated once per row */
    .kind {
      grid-column: 1;
      align-self: center;
      text-align: right;
    }
    .kind-name {
      font-size: 17px;
      font-weight: var(--font-weight-bold);
      color: var(--text-primary);
      letter-spacing: -0.01em;
    }
    .kind.dead .kind-name { color: #e05252; }

    /* Reactor headers */
    .side-head {
      border-radius: var(--radius-md);
      padding: var(--space-sm) var(--space-md);
      font-size: 17px;
      font-weight: var(--font-weight-bold);
      text-align: center;
      border: 1px solid;
    }
    .side-head.a { color: var(--accent-cyan);  border-color: var(--accent-cyan);  background: var(--accent-cyan-bg); }
    .side-head.b { color: var(--accent-green); border-color: var(--accent-green); background: var(--accent-green-bg); }

    /* The one channel the pair shares, running the full height between them */
    .channel {
      grid-column: 3;
      grid-row: 1 / 5;
      justify-self: center;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      border-left: 1px dashed var(--border-glass);
      border-right: 1px dashed var(--border-glass);
    }
    .channel {
      flex-direction: column;
      gap: var(--space-sm);
    }
    .ch-name {
      font-size: 11px;
      font-weight: var(--font-weight-semibold);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
      text-align: center;
    }
    /* one arrow each way across the channel, in the colour of whose ops travel it */
    .ch-arrow { width: 88px; height: 2px; position: relative; }
    .ch-arrow.to-b { background: var(--accent-cyan); }
    .ch-arrow.to-b::after {
      content: ''; position: absolute; left: 100%; top: 50%; transform: translateY(-50%);
      border-top: 6px solid transparent; border-bottom: 6px solid transparent;
      border-left: 9px solid var(--accent-cyan);
    }
    .ch-arrow.to-a { background: var(--accent-green); }
    .ch-arrow.to-a::before {
      content: ''; position: absolute; right: 100%; top: 50%; transform: translateY(-50%);
      border-top: 6px solid transparent; border-bottom: 6px solid transparent;
      border-right: 9px solid var(--accent-green);
    }

    /* Mailbox contents */
    .mb {
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      background: rgba(0, 0, 0, 0.25);
      padding: var(--space-md);
      display: flex;
      align-items: center;
    }
    .ops { display: flex; gap: var(--space-sm); width: 100%; }
    .op {
      flex: 1;
      border: 1px solid;
      border-radius: var(--radius-sm, 8px);
      padding: 8px 4px;
      text-align: center;
      font-size: 15px;
      font-weight: var(--font-weight-semibold);
      line-height: 1.15;
    }
    .op.a { color: var(--accent-cyan);  border-color: var(--accent-cyan);  background: var(--accent-cyan-bg); }
    .op.b { color: var(--accent-green); border-color: var(--accent-green); background: var(--accent-green-bg); }
    .op.failed { color: #e05252; border-color: #e05252; background: rgba(224, 82, 82, 0.08); }
    .op .ts {
      display: block;
      font-size: 11px;
      font-weight: var(--font-weight-medium);
      color: var(--text-muted);
      margin-top: 3px;
    }
    .op .hash {
      display: block;
      font-family: var(--font-mono, 'SF Mono', 'Fira Code', monospace);
      font-size: 10px;
      font-weight: var(--font-weight-medium);
      color: var(--text-muted);
      opacity: 0.75;
    }
    .empty {
      width: 100%;
      font-size: 12px;
      color: var(--text-muted);
      text-align: center;
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <div class="frame">
    <div class="card">
      <div class="card-body">
        <div class="wire">

          <!-- row 1: the two Reactors, and the channel between them -->
          <div></div>
          <div class="side-head a">Reactor A</div>
          <div class="channel">
            <div class="ch-name">one channel</div>
            <div class="ch-arrow to-b"></div>
            <div class="ch-arrow to-a"></div>
          </div>
          <div class="side-head b">Reactor B</div>

          <!-- row 2 -->
          <div class="kind">
            <div class="kind-name">Outbox</div>
          </div>
          <div class="mb">
            <div class="ops">
              <div class="op a">A&#8323;<span class="ts">t=12</span><span class="hash">e9c4</span></div>
              <div class="op a">A&#8324;<span class="ts">t=18</span><span class="hash">f2a8</span></div>
              <div class="op a">A&#8325;<span class="ts">t=27</span><span class="hash">c1d9</span></div>
            </div>
          </div>
          <div class="mb">
            <div class="ops">
              <div class="op b">B&#8323;<span class="ts">t=14</span><span class="hash">a8f5</span></div>
              <div class="op b">B&#8324;<span class="ts">t=21</span><span class="hash">e3d7</span></div>
              <div class="op b">B&#8325;<span class="ts">t=30</span><span class="hash">f7b1</span></div>
            </div>
          </div>

          <!-- row 3: each side holds what the other sent -->
          <div class="kind">
            <div class="kind-name">Inbox</div>
          </div>
          <div class="mb">
            <div class="ops">
              <div class="op b">B&#8324;<span class="ts">t=21</span><span class="hash">e3d7</span></div>
              <div class="op b">B&#8325;<span class="ts">t=30</span><span class="hash">f7b1</span></div>
            </div>
          </div>
          <div class="mb">
            <div class="ops">
              <div class="op a">A&#8323;<span class="ts">t=12</span><span class="hash">e9c4</span></div>
              <div class="op a">A&#8324;<span class="ts">t=18</span><span class="hash">f2a8</span></div>
              <div class="op a">A&#8325;<span class="ts">t=27</span><span class="hash">c1d9</span></div>
            </div>
          </div>

          <!-- row 4: B3 could not be applied, so it never reached A's inbox -->
          <div class="kind dead">
            <div class="kind-name">Dead letter</div>
          </div>
          <div class="mb">
            <div class="ops">
              <div class="op failed">B&#8323; &#10005;<span class="ts">t=14</span><span class="hash">a8f5</span></div>
            </div>
          </div>
          <div class="mb">
            <div class="empty">empty</div>
          </div>

        </div>
      </div>
    </div>
  </div>
</body>
</html>
