<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <style>
    .frame { max-width: 1160px; }
    .card  { height: auto; }
    .card-body { flex: none; }

    .mono { font-family: 'SF Mono', 'Fira Code', monospace; letter-spacing: -0.01em; }

    /* Write on the left, the token in the middle, read on the right */
    .trip {
      display: grid;
      grid-template-columns: 1fr 88px 300px 88px 1fr;
      gap: var(--space-md);
      align-items: center;
    }

    .side {
      border: 1px dashed var(--border-glass);
      border-radius: var(--radius-md);
      padding: var(--space-lg) var(--space-md) var(--space-md);
      position: relative;
    }
    .side-label {
      position: absolute;
      top: -9px;
      left: var(--space-md);
      font-size: 11px;
      font-weight: var(--font-weight-semibold);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      background: var(--bg-surface);
      padding: 0 var(--space-sm);
      color: var(--text-muted);
    }

    .box {
      background: var(--bg-elevated);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-md);
      padding: var(--space-sm) var(--space-md);
      text-align: center;
      font-size: 13px;
      font-weight: var(--font-weight-semibold);
    }
    .box.accent-purple { border-color: var(--accent-purple); background: var(--accent-purple-bg); color: var(--accent-purple); }
    .box.accent-blue   { border-color: var(--accent-blue);   background: var(--accent-blue-bg);   color: var(--accent-blue); }
    .box.accent-green  { border-color: var(--accent-green);  background: var(--accent-green-bg);  color: var(--accent-green); }
    .box.accent-cyan   { border-color: var(--accent-cyan);   background: var(--accent-cyan-bg);   color: var(--accent-cyan); }
    .box.accent-amber  { border-color: #F59E0B; background: rgba(245, 158, 11, 0.12); color: #F59E0B; }

    /* Vertical connector, labelled only where the label is a real name */
    .v-conn {
      width: 3px;
      height: 16px;
      background: var(--text-primary);
      margin: var(--space-sm) auto var(--space-md);
      position: relative;
    }
    .v-conn::after {
      content: '';
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-top: 8px solid var(--text-primary);
    }
    .v-conn-label {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 10px;
      font-weight: var(--font-weight-semibold);
      color: var(--text-muted);
      white-space: nowrap;
      font-family: 'SF Mono', 'Fira Code', monospace;
    }

    /* The token */
    .token {
      border: 1px solid var(--accent-cyan);
      background: var(--accent-cyan-bg);
      border-radius: var(--radius-md);
      padding: var(--space-md);
    }
    .token-title {
      font-size: 13px;
      font-weight: var(--font-weight-semibold);
      color: var(--accent-cyan);
      text-align: center;
      margin-bottom: var(--space-sm);
    }
    .token-body {
      font-size: 12px;
      line-height: 1.7;
      color: var(--text-primary);
      white-space: pre;
    }
    .token-body .k { color: var(--text-muted); }
    .token-body .n { color: var(--accent-cyan); }

    /* The two hops the token makes, left to right across the middle */
    .hop {
      position: relative;
      height: 2px;
      background: var(--accent-cyan);
    }
    .hop::after {
      content: '';
      position: absolute;
      right: -1px;
      top: 50%;
      transform: translateY(-50%);
      border-top: 5px solid transparent;
      border-bottom: 5px solid transparent;
      border-left: 7px solid var(--accent-cyan);
    }
    .hop-label {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      font-weight: var(--font-weight-semibold);
      font-family: 'SF Mono', 'Fira Code', monospace;
      color: var(--accent-cyan);
      white-space: nowrap;
    }

    /* The lag the token covers */
    .catchup {
      margin-top: var(--space-lg);
      border-top: 1px solid var(--border-subtle);
      padding-top: var(--space-lg);
      display: grid;
      grid-template-columns: 1fr auto 1fr auto 1fr;
      gap: var(--space-md);
      align-items: center;
    }
    .catchup-arrow {
      position: relative;
      height: 2px;
      background: var(--text-muted);
      min-width: 168px;
    }
    .catchup-arrow::after {
      content: '';
      position: absolute;
      right: -1px;
      top: 50%;
      transform: translateY(-50%);
      border-top: 5px solid transparent;
      border-bottom: 5px solid transparent;
      border-left: 7px solid var(--text-muted);
    }
    .catchup-label {
      position: absolute;
      bottom: 7px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 10px;
      font-weight: var(--font-weight-semibold);
      font-family: 'SF Mono', 'Fira Code', monospace;
      color: var(--text-muted);
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="frame">
    <div class="card">
      <div class="card-body">

        <div class="trip">

          <!-- ============ Write ============ -->
          <div class="side">
            <span class="side-label">Write</span>

            <div class="box accent-purple mono">Executor</div>

            <div class="v-conn"></div>

            <div class="box accent-green mono">Op Store</div>
          </div>

          <!-- ============ The token, handed across the middle ============ -->
          <div class="hop"><span class="hop-label">Token</span></div>

          <div>
            <div class="token">
              <div class="token-title mono">ConsistencyToken</div>
<div class="token-body mono"><span class="k">coordinates: [</span>
  { documentId: <span class="n">"doc_a1"</span>,
    scope:      <span class="n">"global"</span>,
    branch:     <span class="n">"main"</span>,
    operationIndex: <span class="n">42</span> }
<span class="k">]</span></div>
            </div>
          </div>

          <div class="hop"></div>

          <!-- ============ Read ============ -->
          <div class="side">
            <span class="side-label">Read</span>

            <div class="box accent-blue mono">get(id, view, consistencyToken)</div>

            <div class="v-conn"></div>

            <div class="box accent-amber mono">Wait(token)</div>

            <div class="v-conn"></div>

            <div class="box accent-green mono">DocumentSnapshot</div>
          </div>

        </div>

        <!-- ============ the lag it covers ============ -->
        <div class="catchup">
          <div class="box accent-green mono">Op Store</div>
          <div class="catchup-arrow"><span class="catchup-label">indexOperations()</span></div>
          <div class="box accent-blue mono">Read models</div>
          <div class="catchup-arrow"><span class="catchup-label">update(coordinates)</span></div>
          <div class="box accent-amber mono">ConsistencyTracker</div>
        </div>

      </div>
    </div>
  </div>
</body>
</html>
