<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <style>
    .frame {
      max-width: 800px;
    }
    .card {
      height: auto;
    }
    .card-body {
      flex: none;
    }

    /* Timeline layout */
    .timelines {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 90px;
    }

    .timeline-row {
      display: flex;
      align-items: center;
      gap: var(--space-md);
    }

    .timeline-label {
      font-size: 12px;
      font-weight: var(--font-weight-semibold);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      width: 80px;
      flex-shrink: 0;
      text-align: right;
      line-height: 1.3;
    }

    .timeline-track {
      flex: 1;
      display: flex;
      align-items: center;
      position: relative;
      height: 40px;
    }

    /* The horizontal line — both peers run the full width */
    .timeline-line {
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 2px;
      transform: translateY(-50%);
    }
    .timeline-line.peer-a  { background: var(--accent-cyan); }
    .timeline-line.server  { background: var(--accent-blue); }
    .timeline-line.peer-b  { background: var(--accent-purple); }

    /* Tick marks — the right-hand fifth is left clear for the arrow labels */
    .ticks {
      display: flex;
      justify-content: space-between;
      width: 80%;
      position: relative;
      z-index: 1;
    }

    /* The dot is centred on the line; the T-label hangs off it, so flipping the label
       to the other side never moves the dot. */
    .tick {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .tick-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      border: 2px solid;
    }
    .tick-dot.accent-cyan   { border-color: var(--accent-cyan);   background: var(--accent-cyan-bg); }
    .tick-dot.accent-blue   { border-color: var(--accent-blue);   background: var(--accent-blue-bg); }
    .tick-dot.accent-purple { border-color: var(--accent-purple); background: var(--accent-purple-bg); }

    /* Bottom row carries its T-labels above the line, leaving the space below it
       free for that client's send / reconcile labels. */

    .tick-label {
      position: absolute;
      top: calc(100% + 5px);
      left: 50%;
      transform: translateX(-50%);
      font-size: 10px;
      font-weight: var(--font-weight-medium);
      color: var(--text-muted);
      font-family: var(--font-mono, 'SF Mono', 'Fira Code', monospace);
    }
    .tick--flip .tick-label {
      top: auto;
      bottom: calc(100% + 5px);
    }

    /* SVG overlay for arrows */
    .arrow-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="frame">
    <div class="card">
      <div class="card-body">
        <div class="timelines" id="timelines">

          <!-- Client A -->
          <div class="timeline-row">
            <div class="timeline-label" style="color: var(--accent-cyan);">Client A</div>
            <div class="timeline-track">
              <div class="timeline-line peer-a"></div>
              <div class="ticks" id="a-ticks">
                <div class="tick"><div class="tick-dot accent-cyan"></div><span class="tick-label">T0</span></div>
                <div class="tick"><div class="tick-dot accent-cyan"></div><span class="tick-label">T1</span></div>
                <div class="tick"><div class="tick-dot accent-cyan"></div><span class="tick-label">T2</span></div>
                <div class="tick"><div class="tick-dot accent-cyan"></div><span class="tick-label">T3</span></div>
                <div class="tick"><div class="tick-dot accent-cyan"></div><span class="tick-label">T4</span></div>
              </div>
            </div>
          </div>

          <!-- Server in the middle: both clients talk to it, not to each other -->
          <div class="timeline-row">
            <div class="timeline-label" style="color: var(--accent-blue);">Server</div>
            <div class="timeline-track">
              <div class="timeline-line server"></div>
              <div class="ticks" id="s-ticks">
                <div class="tick"><div class="tick-dot accent-blue"></div></div>
                <div class="tick"><div class="tick-dot accent-blue"></div></div>
                <div class="tick"><div class="tick-dot accent-blue"></div></div>
                <div class="tick"><div class="tick-dot accent-blue"></div></div>
                <div class="tick"><div class="tick-dot accent-blue"></div></div>
              </div>
            </div>
          </div>

          <!-- Client B — the same three steps as A -->
          <div class="timeline-row">
            <div class="timeline-label" style="color: var(--accent-purple);">Client B</div>
            <div class="timeline-track">
              <div class="timeline-line peer-b"></div>
              <div class="ticks" id="b-ticks">
                <div class="tick tick--flip"><div class="tick-dot accent-purple"></div><span class="tick-label">T0</span></div>
                <div class="tick tick--flip"><div class="tick-dot accent-purple"></div><span class="tick-label">T1</span></div>
                <div class="tick tick--flip"><div class="tick-dot accent-purple"></div><span class="tick-label">T2</span></div>
                <div class="tick tick--flip"><div class="tick-dot accent-purple"></div><span class="tick-label">T3</span></div>
                <div class="tick tick--flip"><div class="tick-dot accent-purple"></div><span class="tick-label">T4</span></div>
              </div>
            </div>
          </div>

          <!-- SVG arrows drawn by script -->
          <svg class="arrow-overlay" id="arrow-svg"></svg>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Both clients do the same three things: send input to the server, receive the
    // authoritative update back, reconcile it against what they already simulated.
    const CYAN = '#04d9eb';
    const BLUE = '#0285ff';
    const PURPLE = '#a93cce';

    function drawArrows() {
      const ns = 'http://www.w3.org/2000/svg';
      const svg = document.getElementById('arrow-svg');
      const container = document.getElementById('timelines');
      const containerRect = container.getBoundingClientRect();

      const aDots = document.querySelectorAll('#a-ticks .tick-dot');
      const sDots = document.querySelectorAll('#s-ticks .tick-dot');
      const bDots = document.querySelectorAll('#b-ticks .tick-dot');

      svg.innerHTML = '';

      const defs = document.createElementNS(ns, 'defs');
      [['arrow-cyan', CYAN], ['arrow-blue', BLUE], ['arrow-purple', PURPLE]].forEach(([id, fill]) => {
        const marker = document.createElementNS(ns, 'marker');
        marker.setAttribute('id', id);
        marker.setAttribute('viewBox', '0 0 10 8');
        marker.setAttribute('refX', '9');
        marker.setAttribute('refY', '4');
        marker.setAttribute('markerWidth', '8');
        marker.setAttribute('markerHeight', '6');
        marker.setAttribute('orient', 'auto');
        const path = document.createElementNS(ns, 'path');
        path.setAttribute('d', 'M0,0 L10,4 L0,8 Z');
        path.setAttribute('fill', fill);
        marker.appendChild(path);
        defs.appendChild(marker);
      });
      svg.appendChild(defs);

      function dotCenter(dot) {
        const r = dot.getBoundingClientRect();
        return {
          x: r.left + r.width / 2 - containerRect.left,
          y: r.top + r.height / 2 - containerRect.top
        };
      }

      function line(from, to, color, markerId) {
        const el = document.createElementNS(ns, 'line');
        el.setAttribute('x1', from.x);
        el.setAttribute('y1', from.y);
        el.setAttribute('x2', to.x);
        el.setAttribute('y2', to.y);
        el.setAttribute('stroke', color);
        el.setAttribute('stroke-width', '2');
        el.setAttribute('marker-end', `url(#${markerId})`);
        el.setAttribute('stroke-dasharray', '6,4');
        svg.appendChild(el);
      }

      function label(text, x, y, color, anchor) {
        const el = document.createElementNS(ns, 'text');
        el.setAttribute('x', x);
        el.setAttribute('y', y);
        el.setAttribute('fill', color);
        el.setAttribute('font-size', '11');
        el.setAttribute('font-weight', '600');
        el.setAttribute('font-family', 'Inter, system-ui, sans-serif');
        el.setAttribute('text-anchor', anchor);
        el.textContent = text;
        svg.appendChild(el);
      }

      const a1 = dotCenter(aDots[1]), a3 = dotCenter(aDots[3]), a4 = dotCenter(aDots[4]);
      const b0 = dotCenter(bDots[0]), b2 = dotCenter(bDots[2]), b4 = dotCenter(bDots[4]);
      const s1 = dotCenter(sDots[1]), s2 = dotCenter(sDots[2]), s3 = dotCenter(sDots[3]);

      // input: each client to the server, on its own schedule
      line(b0, s1, PURPLE, 'arrow-purple');
      line(a1, s2, CYAN, 'arrow-cyan');
      // authoritative update: the server back to the client that sent it
      line(s1, b2, BLUE, 'arrow-blue');
      line(s2, a3, BLUE, 'arrow-blue');
      // events the server originates itself, pushed to everyone
      line(s3, a4, BLUE, 'arrow-blue');
      line(s3, b4, BLUE, 'arrow-blue');

      // A's labels sit above its line, B's below its line — clear of the T-labels either way
      label('send', a1.x - 12, a1.y - 10, CYAN, 'end');
      label('reconcile', a3.x + 12, a3.y - 10, BLUE, 'start');
      label('send', b0.x + 12, b0.y + 18, PURPLE, 'start');
      label('reconcile', b2.x + 12, b2.y + 18, BLUE, 'start');
      label('server events', s3.x - 12, s3.y - 10, BLUE, 'end');
    }

    window.addEventListener('load', drawArrows);
    window.addEventListener('resize', drawArrows);
  </script>
</body>
</html>
