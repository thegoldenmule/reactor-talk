<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <style>
    .frame {
      max-width: 800px;
    }
    .card {
      height: auto;
    }
    .card-body {
      flex: none;
    }

    /* Timeline layout */
    .timelines {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 110px;
    }

    .timeline-row {
      display: flex;
      align-items: center;
      gap: var(--space-md);
    }

    .timeline-label {
      font-size: 12px;
      font-weight: var(--font-weight-semibold);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      width: 80px;
      flex-shrink: 0;
      text-align: right;
      line-height: 1.3;
    }

    .timeline-track {
      flex: 1;
      display: flex;
      align-items: center;
      position: relative;
      height: 40px;
    }

    /* The horizontal line — both peers run the full width */
    .timeline-line {
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 2px;
      transform: translateY(-50%);
    }
    .timeline-line.peer-a { background: var(--accent-cyan); }
    .timeline-line.peer-b { background: var(--accent-purple); }

    /* Tick marks — the right-hand fifth is left clear for the arrow labels */
    .ticks {
      display: flex;
      justify-content: space-between;
      width: 80%;
      position: relative;
      z-index: 1;
    }

    .tick {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .tick-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      border: 2px solid;
    }
    .tick-dot.accent-cyan   { border-color: var(--accent-cyan);   background: var(--accent-cyan-bg); }
    .tick-dot.accent-purple { border-color: var(--accent-purple); background: var(--accent-purple-bg); }

    .tick-label {
      font-size: 10px;
      font-weight: var(--font-weight-medium);
      color: var(--text-muted);
      font-family: var(--font-mono, 'SF Mono', 'Fira Code', monospace);
    }

    /* SVG overlay for arrows */
    .arrow-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="frame">
    <div class="card">
      <div class="card-body">
        <div class="timelines" id="timelines">

          <!-- Client A -->
          <div class="timeline-row">
            <div class="timeline-label" style="color: var(--accent-cyan);">Client A</div>
            <div class="timeline-track">
              <div class="timeline-line peer-a"></div>
              <div class="ticks" id="a-ticks">
                <div class="tick"><div class="tick-dot accent-cyan"></div><span class="tick-label">T0</span></div>
                <div class="tick"><div class="tick-dot accent-cyan"></div><span class="tick-label">T1</span></div>
                <div class="tick"><div class="tick-dot accent-cyan"></div><span class="tick-label">T2</span></div>
                <div class="tick"><div class="tick-dot accent-cyan"></div><span class="tick-label">T3</span></div>
                <div class="tick"><div class="tick-dot accent-cyan"></div><span class="tick-label">T4</span></div>
              </div>
            </div>
          </div>

          <!-- Client B — the same thing, the other way round -->
          <div class="timeline-row">
            <div class="timeline-label" style="color: var(--accent-purple);">Client B</div>
            <div class="timeline-track">
              <div class="timeline-line peer-b"></div>
              <div class="ticks" id="b-ticks">
                <div class="tick"><div class="tick-dot accent-purple"></div><span class="tick-label">T0</span></div>
                <div class="tick"><div class="tick-dot accent-purple"></div><span class="tick-label">T1</span></div>
                <div class="tick"><div class="tick-dot accent-purple"></div><span class="tick-label">T2</span></div>
                <div class="tick"><div class="tick-dot accent-purple"></div><span class="tick-label">T3</span></div>
                <div class="tick"><div class="tick-dot accent-purple"></div><span class="tick-label">T4</span></div>
              </div>
            </div>
          </div>

          <!-- SVG arrows drawn by script -->
          <svg class="arrow-overlay" id="arrow-svg"></svg>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Each peer sends at T1 and reconciles what it receives at T3 — the same three
    // steps, mirrored, so the two arrows cross.
    const CYAN = '#04d9eb';
    const PURPLE = '#a93cce';

    function drawArrows() {
      const ns = 'http://www.w3.org/2000/svg';
      const svg = document.getElementById('arrow-svg');
      const container = document.getElementById('timelines');
      const containerRect = container.getBoundingClientRect();

      const aDots = document.querySelectorAll('#a-ticks .tick-dot');
      const bDots = document.querySelectorAll('#b-ticks .tick-dot');

      svg.innerHTML = '';

      const defs = document.createElementNS(ns, 'defs');
      [['arrow-cyan', CYAN], ['arrow-purple', PURPLE]].forEach(([id, fill]) => {
        const marker = document.createElementNS(ns, 'marker');
        marker.setAttribute('id', id);
        marker.setAttribute('viewBox', '0 0 10 8');
        marker.setAttribute('refX', '9');
        marker.setAttribute('refY', '4');
        marker.setAttribute('markerWidth', '8');
        marker.setAttribute('markerHeight', '6');
        marker.setAttribute('orient', 'auto');
        const path = document.createElementNS(ns, 'path');
        path.setAttribute('d', 'M0,0 L10,4 L0,8 Z');
        path.setAttribute('fill', fill);
        marker.appendChild(path);
        defs.appendChild(marker);
      });
      svg.appendChild(defs);

      function dotCenter(dot) {
        const r = dot.getBoundingClientRect();
        return {
          x: r.left + r.width / 2 - containerRect.left,
          y: r.top + r.height / 2 - containerRect.top
        };
      }

      function label(text, x, y, color, anchor) {
        const el = document.createElementNS(ns, 'text');
        el.setAttribute('x', x);
        el.setAttribute('y', y);
        el.setAttribute('fill', color);
        el.setAttribute('font-size', '11');
        el.setAttribute('font-weight', '600');
        el.setAttribute('font-family', 'Inter, system-ui, sans-serif');
        el.setAttribute('text-anchor', anchor);
        el.textContent = text;
        svg.appendChild(el);
      }

      // from/to are dot centres; labels sit above each line, clear of the T-labels below it
      function hop(from, to, color, markerId) {
        const line = document.createElementNS(ns, 'line');
        line.setAttribute('x1', from.x);
        line.setAttribute('y1', from.y);
        line.setAttribute('x2', to.x);
        line.setAttribute('y2', to.y);
        line.setAttribute('stroke', color);
        line.setAttribute('stroke-width', '2');
        line.setAttribute('marker-end', `url(#${markerId})`);
        line.setAttribute('stroke-dasharray', '6,4');
        svg.appendChild(line);

        label('send', from.x - 12, from.y - 10, color, 'end');
        label('reconcile', to.x + 12, to.y - 10, color, 'start');
      }

      // A sends at T1, B reconciles at T3
      hop(dotCenter(aDots[1]), dotCenter(bDots[3]), CYAN, 'arrow-cyan');
      // B sends at T1, A reconciles at T3
      hop(dotCenter(bDots[1]), dotCenter(aDots[3]), PURPLE, 'arrow-purple');
    }

    window.addEventListener('load', drawArrows);
    window.addEventListener('resize', drawArrows);
  </script>
</body>
</html>
