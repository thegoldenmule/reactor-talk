<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <style>
    .frame { max-width: 1120px; }
    .card { height: auto; }
    .card-body { flex: none; gap: var(--space-md); }

    /* The write path on the left, what travels down it on the right */
    .layout {
      display: grid;
      grid-template-columns: 1fr auto 300px;
      gap: var(--space-xl);
      align-items: stretch;
      position: relative;
    }
    /* Dotted links drawn between the two sections */
    .link-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
    }
    .layout-divider {
      width: 1px;
      background: linear-gradient(to bottom,
        transparent,
        var(--border-glass) 6%,
        var(--border-glass) 94%,
        transparent);
    }

    /* Box component */
    .box {
      background: var(--bg-elevated);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-md);
      padding: var(--space-md) var(--space-lg);
      font-size: 13px;
      font-weight: var(--font-weight-medium);
      text-align: center;
    }
    .box.accent-cyan   { border-color: var(--accent-cyan);   background: var(--accent-cyan-bg);   color: var(--accent-cyan); }
    .box.accent-purple { border-color: var(--accent-purple); background: var(--accent-purple-bg); color: var(--accent-purple); }
    .box.accent-blue   { border-color: var(--accent-blue);   background: var(--accent-blue-bg);   color: var(--accent-blue); }
    .box.accent-green  { border-color: var(--accent-green);  background: var(--accent-green-bg);  color: var(--accent-green); }

    .box-title {
      font-size: 14px;
      font-weight: var(--font-weight-semibold);
    }
    .box-detail {
      font-size: 12px;
      opacity: 0.75;
      line-height: var(--line-height-normal);
      margin-top: var(--space-xs);
    }

    /* Main vertical flow */
    .diagram-flow {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .queue-box { width: 64%; }

    /* ---- fan connectors ------------------------------------------------- */
    /* Centers of the outer columns in a 3-up grid: 100%/6 - gap/3 from each edge */
    .fan {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .fan-stem {
      width: 3px;
      height: 16px;
      background: var(--text-primary);
    }
    .fan-branches {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0 var(--space-md);
      width: 100%;
      position: relative;
    }
    .fan-bar {
      position: absolute;
      left: calc(100% / 6 - var(--space-md) / 3);
      right: calc(100% / 6 - var(--space-md) / 3);
      height: 3px;
      background: var(--text-primary);
    }
    .fan--out .fan-bar { top: 0; }
    .fan--in  .fan-bar { bottom: 0; }

    .fan-branch {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .fan-arm {
      width: 3px;
      height: 26px;
      background: var(--text-primary);
      position: relative;
    }
    /* Arrowheads: fan-out points into the executors, fan-in points into the store */
    .fan--out .fan-arm::after {
      content: '';
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-top: 8px solid var(--text-primary);
    }
    .fan-stem--arrow {
      width: 3px;
      height: 22px;
      background: var(--text-primary);
      position: relative;
    }
    .fan-stem--arrow::after {
      content: '';
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-top: 8px solid var(--text-primary);
    }
    /* Leave room for the arrowhead that hangs below the line */
    .fan--out { margin-bottom: var(--space-sm); }
    .fan--in  { margin-top: var(--space-sm); margin-bottom: var(--space-sm); }

    /* ---- drive columns --------------------------------------------------- */
    .drive-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0 var(--space-md);
      width: 100%;
    }
    .drive {
      border: 2px dashed var(--text-secondary);
      border-radius: var(--radius-md);
      padding: var(--space-sm);
      padding-top: var(--space-md);
      position: relative;
    }
    .drive-label {
      position: absolute;
      top: -10px;
      left: var(--space-sm);
      font-size: 11px;
      font-weight: var(--font-weight-bold);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      background: var(--bg-surface);
      padding: 0 var(--space-xs);
      color: var(--text-primary);
      white-space: nowrap;
    }
    .drive .box { padding: var(--space-md) var(--space-sm); }

    /* Reducer nested inside the executor */
    .reducer {
      margin-top: var(--space-sm);
      background: var(--bg-elevated);
      border: 1px solid var(--accent-cyan);
      border-radius: var(--radius-sm);
      padding: var(--space-xs) var(--space-sm);
      font-size: 11px;
      font-weight: var(--font-weight-medium);
      color: var(--accent-cyan);
      text-align: center;
    }

    /* Each executor holds its own connection to the store */
    .pg-conn {
      margin-top: var(--space-sm);
      border: 1px solid var(--accent-green);
      border-radius: var(--radius-sm);
      padding: var(--space-xs) var(--space-sm);
      font-size: 11px;
      font-weight: var(--font-weight-medium);
      color: var(--accent-green);
      text-align: center;
    }

    /* ---- op store --------------------------------------------------------- */
    .pool { width: 78%; }

    /* ---- anatomy: an Action, then the Operation that carries it ------------- */
    /* Each box is centred on its counterpart in the flow, so the two sections
       line up through the middle rather than at their edges. */
    .anatomy { position: relative; }
    .anatomy > .action,
    .anatomy > .operation,
    .anatomy-stem {
      position: absolute;
      left: 0;
      right: 0;
    }
    .mono { font-family: 'SF Mono', 'Fira Code', monospace; letter-spacing: -0.01em; }

    .action {
      border: 1px solid var(--accent-purple);
      background: var(--accent-purple-bg);
      border-radius: var(--radius-md);
      padding: var(--space-sm) var(--space-md);
    }
    .action-title {
      font-size: 13px;
      font-weight: var(--font-weight-semibold);
      color: var(--accent-purple);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: var(--space-xs);
    }

    .field {
      display: flex;
      gap: var(--space-sm);
      font-size: 12px;
      line-height: 1.5;
    }
    .field-key { color: var(--text-muted); }
    .field-val { color: var(--text-primary); }
    .field-val.sig { color: var(--accent-cyan); }

    /* The stem between them is measured to fit whatever gap is left */
    .anatomy-stem {
      width: 3px;
      margin: 0 auto;
      background: var(--text-primary);
    }
    .anatomy-stem::after {
      content: '';
      position: absolute;
      top: calc(100% - 8px);
      left: 50%;
      transform: translateX(-50%);
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-top: 8px solid var(--text-primary);
    }

    /* The Operation wraps the very same Action box */
    .operation {
      border: 1px solid var(--accent-green);
      background: var(--accent-green-bg);
      border-radius: var(--radius-md);
      padding: var(--space-sm) var(--space-md);
    }
    .operation-title {
      font-size: 13px;
      font-weight: var(--font-weight-semibold);
      color: var(--accent-green);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: var(--space-xs);
    }
    .operation .action { margin-top: var(--space-xs); }
  </style>
</head>
<body>
  <div class="frame">
    <div class="card">
      <div class="card-body">
        <div class="layout">
        <svg class="link-overlay" id="linkSvg"></svg>
        <div class="diagram-flow">

          <!-- Job queue -->
          <div class="box accent-purple queue-box">
            <div class="box-title">Job Queue</div>
            <div class="box-detail">jobs partitioned by drive</div>
          </div>

          <!-- Fan out into the drive columns -->
          <div class="fan fan--out">
            <div class="fan-stem"></div>
            <div class="fan-branches">
              <div class="fan-bar"></div>
              <div class="fan-branch"><div class="fan-arm"></div></div>
              <div class="fan-branch"><div class="fan-arm"></div></div>
              <div class="fan-branch"><div class="fan-arm"></div></div>
            </div>
          </div>

          <!-- One executor column per drive -->
          <div class="drive-row">
            <div class="drive">
              <span class="drive-label">Drive A</span>
              <div class="box accent-blue">
                <div class="box-title">Executor</div>
                <div class="reducer">Reducer</div>
                <div class="pg-conn">PG Connection</div>
              </div>
            </div>
            <div class="drive">
              <span class="drive-label">Drive B</span>
              <div class="box accent-blue">
                <div class="box-title">Executor</div>
                <div class="reducer">Reducer</div>
                <div class="pg-conn">PG Connection</div>
              </div>
            </div>
            <div class="drive">
              <span class="drive-label">Drive C</span>
              <div class="box accent-blue">
                <div class="box-title">Executor</div>
                <div class="reducer">Reducer</div>
                <div class="pg-conn">PG Connection</div>
              </div>
            </div>
          </div>

          <!-- Fan back in to the shared store -->
          <div class="fan fan--in">
            <div class="fan-branches">
              <div class="fan-bar"></div>
              <div class="fan-branch"><div class="fan-arm"></div></div>
              <div class="fan-branch"><div class="fan-arm"></div></div>
              <div class="fan-branch"><div class="fan-arm"></div></div>
            </div>
            <div class="fan-stem--arrow"></div>
          </div>

          <!-- Op store: a Postgres connection pool -->
          <div class="box accent-green pool">
            <div class="box-title">Op Store</div>
          </div>

        </div>

        <div class="layout-divider"></div>

        <!-- What the queue carries: an Action, wrapped into an Operation -->
        <aside class="anatomy">

          <div class="action" id="actionCard">
            <div class="action-title">Command</div>
            <div class="field mono"><span class="field-key">type</span><span class="field-val">SET_TITLE</span></div>
            <div class="field mono"><span class="field-key">input</span><span class="field-val">{ title: "Q3" }</span></div>
            <div class="field mono"><span class="field-key">sig</span><span class="field-val sig">0x8f&hellip;c1</span></div>
          </div>

          <div class="anatomy-stem" id="anatomyStem"></div>

          <div class="operation" id="operationCard">
            <div class="operation-title">Operation</div>
            <div class="field mono"><span class="field-key">index</span><span class="field-val">42</span></div>
            <div class="field mono"><span class="field-key">t</span><span class="field-val">1732041600</span></div>
            <div class="action">
              <div class="action-title">Command</div>
              <div class="field mono"><span class="field-key">type</span><span class="field-val">SET_TITLE</span></div>
              <div class="field mono"><span class="field-key">input</span><span class="field-val">{ title: "Q3" }</span></div>
              <div class="field mono"><span class="field-key">sig</span><span class="field-val sig">0x8f&hellip;c1</span></div>
            </div>
          </div>

        </aside>
        </div>
      </div>
    </div>
  </div>
  <script>
    // Centre each anatomy box on its counterpart in the flow, then dot a line between them.
    function alignAnatomy() {
      const layout = document.querySelector('.layout');
      const flow = document.querySelector('.diagram-flow');
      const anatomy = document.querySelector('.anatomy');
      const svg = document.getElementById('linkSvg');
      const pairs = [
        { card: document.getElementById('actionCard'), target: document.querySelector('.queue-box') },
        { card: document.getElementById('operationCard'), target: document.querySelector('.pool') }
      ];

      // The centred boxes are taller than what sits above and below their counterparts,
      // so give the flow just enough room for them to hang off either end.
      flow.style.paddingTop = '0px';
      flow.style.paddingBottom = '0px';
      const flowRect = flow.getBoundingClientRect();
      const first = pairs[0], last = pairs[1];
      const firstCentre = centreOf(first.target);
      const lastCentre = centreOf(last.target);
      const padTop = Math.max(0, first.card.offsetHeight / 2 - (firstCentre - flowRect.top));
      const padBottom = Math.max(0, last.card.offsetHeight / 2 - (flowRect.bottom - lastCentre));
      flow.style.paddingTop = padTop + 'px';
      flow.style.paddingBottom = padBottom + 'px';

      // Position the boxes on their counterparts' centres.
      const anatomyRect = anatomy.getBoundingClientRect();
      for (const { card, target } of pairs) {
        card.style.top = (centreOf(target) - anatomyRect.top - card.offsetHeight / 2) + 'px';
      }

      // The stem spans whatever is left between them.
      const stem = document.getElementById('anatomyStem');
      const top = first.card.offsetTop + first.card.offsetHeight + 12;
      stem.style.top = top + 'px';
      stem.style.height = Math.max(0, last.card.offsetTop - 12 - top) + 'px';

      // Dotted links, box edge to box edge.
      const layoutRect = layout.getBoundingClientRect();
      svg.querySelectorAll('line').forEach(l => l.remove());
      for (const { card, target } of pairs) {
        const t = target.getBoundingClientRect();
        const c = card.getBoundingClientRect();
        const y = t.top + t.height / 2 - layoutRect.top;
        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line.setAttribute('x1', t.right - layoutRect.left);
        line.setAttribute('y1', y);
        line.setAttribute('x2', c.left - layoutRect.left);
        line.setAttribute('y2', y);
        line.setAttribute('stroke', 'rgba(255, 255, 255, 0.45)');
        line.setAttribute('stroke-width', '2');
        line.setAttribute('stroke-linecap', 'round');
        line.setAttribute('stroke-dasharray', '2 6');
        svg.appendChild(line);
      }

      function centreOf(el) {
        const r = el.getBoundingClientRect();
        return r.top + r.height / 2;
      }
    }

    alignAnatomy();
    // Web fonts land after first layout and move everything down, so measure again.
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(alignAnatomy);
    window.addEventListener('resize', alignAnatomy);
  </script>
</body>
</html>
