<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <style>
    /* A on the left, B on the right. A's inbox faces B's outbox, A's outbox faces B's inbox,
       so each mailbox sits opposite the one it sets and both crossings are horizontal.

       Between them one big arrow per message, shaped to point the way it travels. The
       cursors it carries ride inside as sub-arrows naming the mapping. Values live in the
       mailboxes only — the sub-arrows state the rule, the boxes hold the numbers.

       Both envelopes use the same 56px padding on both sides, so their inner grids are
       identical and all three sub-arrows sit in one vertical column. 56 clears the 46px
       clip-path point on whichever side it falls.

       Colour is reactor identity: A cyan, B green, everywhere. */
    .frame { max-width: 1200px; }
    .card { height: auto; }
    .card-body { flex: none; }

    .wrap {
      display: grid;
      grid-template-columns: 1fr 1.6fr 1fr;
      column-gap: var(--space-md);
      row-gap: var(--space-lg);
      align-items: stretch;
    }

    .who { grid-row: 1; font-size: 16px; font-weight: var(--font-weight-bold); text-align: center; }
    .who.a { grid-column: 1; color: var(--accent-cyan); }
    .who.b { grid-column: 3; color: var(--accent-green); }

    .mb {
      border: 1px solid;
      border-radius: var(--radius-md);
      background: rgba(0, 0, 0, 0.25);
      padding: var(--space-sm) var(--space-md) var(--space-md);
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .mb.a { border-color: var(--accent-cyan); }
    .mb.b { border-color: var(--accent-green); }
    .mb-name {
      font-size: 11px;
      font-weight: var(--font-weight-bold);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .mb.a .mb-name { color: var(--accent-cyan); }
    .mb.b .mb-name { color: var(--accent-green); }
    .val {
      display: flex;
      justify-content: space-between;
      gap: var(--space-lg);
      font-family: var(--font-mono, 'SF Mono', 'Fira Code', monospace);
      font-size: 14px;
      line-height: 1.7;
    }
    .val .k { color: var(--text-secondary); }
    .val .v { color: var(--text-primary); font-weight: var(--font-weight-bold); }

    .envelope {
      grid-column: 2;
      background: rgba(255, 255, 255, 0.05);
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 9px;
      padding: var(--space-md) 56px;
    }
    .envelope.to-b { clip-path: polygon(0 0, calc(100% - 46px) 0, 100% 50%, calc(100% - 46px) 100%, 0 100%); }
    .envelope.to-a { clip-path: polygon(46px 0, 100% 0, 100% 100%, 46px 100%, 0 50%); }
    .env-name {
      font-size: 11px;
      font-weight: var(--font-weight-bold);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-secondary);
    }
    .envelope.to-a .env-name { text-align: right; }

    /* one fixed 3-track grid, identical in both envelopes, so the arrows form a column */
    .carries {
      display: grid;
      grid-template-columns: 1fr 58px 1fr;
      align-items: center;
      column-gap: var(--space-md);
      font-family: var(--font-mono, 'SF Mono', 'Fira Code', monospace);
      font-size: 14px;
    }
    .cur { font-weight: var(--font-weight-bold); white-space: nowrap; }
    .cur.l { justify-self: end; }
    .cur.r { justify-self: start; }
    .cur.a { color: var(--accent-cyan); }
    .cur.b { color: var(--accent-green); }
    .cur.none { color: var(--text-muted); font-weight: var(--font-weight-medium); font-size: 12.5px; }

    .mini { position: relative; width: 100%; height: 2px; background: var(--text-secondary); }
    .mini::after {
      content: '';
      position: absolute; top: 50%;
      transform: translateY(-50%);
      border-top: 5px solid transparent;
      border-bottom: 5px solid transparent;
    }
    .envelope.to-b .mini::after { right: -1px; border-left:  7px solid var(--text-secondary); }
    .envelope.to-a .mini::after { left:  -1px; border-right: 7px solid var(--text-secondary); }
    .mini.soft { background: none; height: 0; border-top: 2px dashed var(--text-muted); }
    .envelope.to-b .mini.soft::after { border-left-color: var(--text-muted); opacity: 0.5; }
  </style>
</head>
<body>
  <div class="frame">
    <div class="card">
      <div class="card-body">
        <div class="wrap">

          <div class="who a">Reactor A</div>
          <div class="who b">Reactor B</div>

          <div class="mb a" style="grid-row: 2; grid-column: 1;">
            <div class="mb-name">inbox</div>
            <div class="val"><span class="k">ack</span><span class="v">112</span></div>
            <div class="val"><span class="k">latest</span><span class="v">114</span></div>
          </div>
          <div class="envelope to-b" style="grid-row: 2;">
            <div class="env-name">request</div>
            <div class="carries">
              <span class="cur a l">inbox.ack</span><span class="mini"></span><span class="cur b r">outbox.ack</span>
            </div>
            <div class="carries">
              <span class="cur a l">inbox.latest</span><span class="mini soft"></span><span class="cur none r">filters only</span>
            </div>
          </div>
          <div class="mb b" style="grid-row: 2; grid-column: 3;">
            <div class="mb-name">outbox</div>
            <div class="val"><span class="k">ack</span><span class="v">112</span></div>
            <div class="val"><span class="k">latest</span><span class="v">115</span></div>
          </div>

          <div class="mb a" style="grid-row: 3; grid-column: 1;">
            <div class="mb-name">outbox</div>
            <div class="val"><span class="k">ack</span><span class="v">45</span></div>
            <div class="val"><span class="k">latest</span><span class="v">48</span></div>
          </div>
          <div class="envelope to-a" style="grid-row: 3;">
            <div class="env-name">response</div>
            <div class="carries">
              <span class="cur a l">outbox.ack</span><span class="mini"></span><span class="cur b r">inbox.ack</span>
            </div>
          </div>
          <div class="mb b" style="grid-row: 3; grid-column: 3;">
            <div class="mb-name">inbox</div>
            <div class="val"><span class="k">ack</span><span class="v">45</span></div>
            <div class="val"><span class="k">latest</span><span class="v">47</span></div>
          </div>

        </div>
      </div>
    </div>
  </div>
</body>
</html>
