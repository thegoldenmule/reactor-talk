<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <style>
    /* One idea: an ack crosses the wire and lands on the other reactor's opposite cursor.
       Two rows, one each way, so the poll carries an acknowledgement in both directions.

       One box style throughout. Colour is the ordinal space, and it never changes along a
       crossing: the green row is B's ordinals, the cyan row is A's. The value repeats across
       a row because that is what "sets the opposite cursor" means.

       inbox.latest also crosses but sets nothing on the remote — it only filters which
       operations come back. That is in the speaker notes, not here; drawing it needed a
       third arrow and a third box style and cost more than it explained. */
    .frame { max-width: 1000px; }
    .card { height: auto; }
    .card-body { flex: none; }

    .wrap {
      display: grid;
      grid-template-columns: 1fr 260px 1fr;
      column-gap: var(--space-lg);
      row-gap: var(--space-xl);
      align-items: center;
    }

    .who {
      grid-row: 1;
      font-size: 16px;
      font-weight: var(--font-weight-bold);
      text-align: center;
    }
    .who.a { grid-column: 1; color: var(--accent-cyan); }
    .who.b { grid-column: 3; color: var(--accent-green); }

    .left  { grid-column: 1; justify-self: end; }
    .right { grid-column: 3; justify-self: start; }

    .chip {
      display: inline-block;
      font-size: 13px;
      font-weight: var(--font-weight-semibold);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 8px 13px;
      border-radius: var(--radius-xs);
      border: 1px solid;
      white-space: nowrap;
      font-family: var(--font-mono, 'SF Mono', 'Fira Code', monospace);
    }
    .chip.cyan  { color: var(--accent-cyan);  border-color: var(--accent-cyan);  background: var(--accent-cyan-bg); }
    .chip.green { color: var(--accent-green); border-color: var(--accent-green); background: var(--accent-green-bg); }

    .hop { grid-column: 2; display: flex; flex-direction: column; align-items: center; gap: 7px; }
    .hop-label {
      font-size: 11px;
      font-weight: var(--font-weight-semibold);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
    }
    .arrow { position: relative; width: 100%; height: 2px; background: var(--border-glass); }
    .arrow::after {
      content: '';
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      border-top: 5px solid transparent;
      border-bottom: 5px solid transparent;
    }
    .arrow.to-b::after { right: -1px; border-left:  8px solid var(--border-glass); }
    .arrow.to-a::after { left:  -1px; border-right: 8px solid var(--border-glass); }
  </style>
</head>
<body>
  <div class="frame">
    <div class="card">
      <div class="card-body">
        <div class="wrap">

          <div class="who a">Reactor A</div>
          <div class="who b">Reactor B</div>

          <div class="left"  style="grid-row: 2;"><span class="chip green">inbox.ack 112</span></div>
          <div class="hop"   style="grid-row: 2;">
            <div class="hop-label">poll request</div>
            <div class="arrow to-b"></div>
          </div>
          <div class="right" style="grid-row: 2;"><span class="chip green">outbox.ack 112</span></div>

          <div class="left"  style="grid-row: 3;"><span class="chip cyan">outbox.ack 45</span></div>
          <div class="hop"   style="grid-row: 3;">
            <div class="hop-label">poll response</div>
            <div class="arrow to-a"></div>
          </div>
          <div class="right" style="grid-row: 3;"><span class="chip cyan">inbox.ack 45</span></div>

        </div>
      </div>
    </div>
  </div>
</body>
</html>
