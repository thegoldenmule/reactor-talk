<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <style>
    /* Two steps in order, request first. Every arrow reads source -> destination, left to
       right, so the one rule the slide teaches is stated twice in the same shape:

           the sender's inbox.ack sets the receiver's outbox.ack

       Earlier versions drew the physical direction of each message instead, which pointed
       the arrows opposite ways and hid the mapping. Direction now lives in the step label.

       Colour is reactor identity only, and only on the possessive: "A's" cyan, "B's" green.
       The cursor names are neutral, so you can see the ownership flip across each arrow
       while the inbox->outbox mapping stays plain. */
    .frame { max-width: 1150px; }
    .card { height: auto; }
    .card-body { flex: none; }

    .wrap {
      display: grid;
      grid-template-columns: 1fr 190px 1fr;
      column-gap: var(--space-lg);
      row-gap: var(--space-md);
      align-items: center;
    }

    .step {
      grid-column: 1 / -1;
      font-size: 11px;
      font-weight: var(--font-weight-semibold);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
    }
    .step.second { margin-top: var(--space-lg); }

    .cur {
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      background: rgba(0, 0, 0, 0.25);
      padding: 10px var(--space-md);
      font-family: var(--font-mono, 'SF Mono', 'Fira Code', monospace);
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: var(--space-lg);
    }
    .cur .name { font-size: 14px; font-weight: var(--font-weight-semibold); color: var(--text-primary); }
    .cur .own  { font-weight: var(--font-weight-bold); }
    .cur .own.a { color: var(--accent-cyan); }
    .cur .own.b { color: var(--accent-green); }
    .cur .v    { font-size: 15px; font-weight: var(--font-weight-bold); color: var(--text-primary); }

    /* nothing lands here */
    .cur.none {
      border-style: dashed;
      background: transparent;
      justify-content: center;
    }
    .cur.none .name { color: var(--text-muted); font-weight: var(--font-weight-medium); }

    .hop { grid-column: 2; display: flex; flex-direction: column; align-items: center; gap: 5px; }
    .hop-verb {
      font-size: 12px;
      font-weight: var(--font-weight-semibold);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-secondary);
    }
    .hop.soft .hop-verb { color: var(--text-muted); }
    .arrow { position: relative; width: 100%; height: 2px; background: var(--border-glass); }
    .arrow::after {
      content: '';
      position: absolute; right: -1px; top: 50%;
      transform: translateY(-50%);
      border-top: 5px solid transparent;
      border-bottom: 5px solid transparent;
      border-left: 8px solid var(--border-glass);
    }
    .arrow.soft { background: none; height: 0; border-top: 2px dashed var(--border-glass); }
    .arrow.soft::after { opacity: 0.45; }
  </style>
</head>
<body>
  <div class="frame">
    <div class="card">
      <div class="card-body">
        <div class="wrap">

          <div class="step">1 &nbsp;·&nbsp; Poll request &nbsp;&mdash;&nbsp; A sends to B</div>

          <div class="cur" style="grid-row: 2; grid-column: 1;">
            <span class="name"><span class="own a">A&rsquo;s</span> inbox.ack</span><span class="v">112</span>
          </div>
          <div class="hop" style="grid-row: 2;">
            <div class="hop-verb">sets</div>
            <div class="arrow"></div>
          </div>
          <div class="cur" style="grid-row: 2; grid-column: 3;">
            <span class="name"><span class="own b">B&rsquo;s</span> outbox.ack</span><span class="v">112</span>
          </div>

          <div class="cur" style="grid-row: 3; grid-column: 1;">
            <span class="name"><span class="own a">A&rsquo;s</span> inbox.latest</span><span class="v">114</span>
          </div>
          <div class="hop soft" style="grid-row: 3;">
            <div class="hop-verb">filters</div>
            <div class="arrow soft"></div>
          </div>
          <div class="cur none" style="grid-row: 3; grid-column: 3;">
            <span class="name">no cursor is set</span>
          </div>

          <div class="step second">2 &nbsp;·&nbsp; Poll response &nbsp;&mdash;&nbsp; B sends to A</div>

          <div class="cur" style="grid-row: 5; grid-column: 1;">
            <span class="name"><span class="own b">B&rsquo;s</span> inbox.ack</span><span class="v">45</span>
          </div>
          <div class="hop" style="grid-row: 5;">
            <div class="hop-verb">sets</div>
            <div class="arrow"></div>
          </div>
          <div class="cur" style="grid-row: 5; grid-column: 3;">
            <span class="name"><span class="own a">A&rsquo;s</span> outbox.ack</span><span class="v">45</span>
          </div>

        </div>
      </div>
    </div>
  </div>
</body>
</html>
