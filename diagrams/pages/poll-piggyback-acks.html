<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <style>
    /* Two messages, one each way. Each carries operations in its own direction and an
       acknowledgement of the other side's operations coming back. What each message carries
       is the sender's inbox cursors, and an inbox's cursors are always stated in the OTHER
       reactor's ordinal space — so the request is green (B's numbers) and the response cyan
       (A's numbers). That flip is the whole point of the slide.

       A's ordinals are in the 40s and B's in the 110s because they are genuinely separate
       spaces. 45 and 47 are B's inbox cursors from the previous slide, unchanged.

       The rows are deliberately uneven. The request sends both inbox cursors
       (gql-req-channel.ts:316 passes inbox.ackOrdinal and inbox.latestOrdinal); the response
       returns only an ackOrdinal, no latest. That asymmetry is real, not a simplification.

       Endpoint boxes, pill tags and line treatment match sync-cursors. Everything is placed
       explicitly. */
    .frame { max-width: 1100px; }
    .card { height: auto; }
    .card-body { flex: none; }

    .wrap {
      display: grid;
      grid-template-columns: 124px 1fr 124px;
      column-gap: var(--space-xl);
      row-gap: var(--space-xl);
      align-items: center;
    }

    .endpoint {
      grid-row: 1 / 3;
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-md);
      padding: var(--space-sm) var(--space-md);
      font-size: 13px;
      font-weight: var(--font-weight-semibold);
      text-align: center;
      background: var(--bg-elevated);
    }
    .endpoint.a { grid-column: 1; border-color: var(--accent-cyan);  background: var(--accent-cyan-bg);  color: var(--accent-cyan); }
    .endpoint.b { grid-column: 3; border-color: var(--accent-green); background: var(--accent-green-bg); color: var(--accent-green); }
    .endpoint .role {
      display: block;
      font-size: 9px;
      font-weight: var(--font-weight-semibold);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .msg {
      grid-column: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .msg-label {
      font-size: 10px;
      font-weight: var(--font-weight-semibold);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
    }
    .chips { display: flex; gap: var(--space-md); }
    .chip {
      font-size: 11px;
      font-weight: var(--font-weight-semibold);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 5px 10px;
      border-radius: var(--radius-xs);
      border: 1px solid;
      white-space: nowrap;
      font-family: var(--font-mono, 'SF Mono', 'Fira Code', monospace);
    }
    .chip.cyan  { color: var(--accent-cyan);  border-color: var(--accent-cyan);  background: var(--accent-cyan-bg); }
    .chip.green { color: var(--accent-green); border-color: var(--accent-green); background: var(--accent-green-bg); }
    /* same convention as sync-cursors: latest is the leading edge, ack is the settled one */
    .chip.dim   { opacity: 0.55; }

    .arrow {
      position: relative;
      width: 100%;
      height: 2px;
      background: var(--border-glass);
    }
    .arrow::after {
      content: '';
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      border-top: 5px solid transparent;
      border-bottom: 5px solid transparent;
    }
    .arrow.to-b::after { right: -1px; border-left:  8px solid var(--border-glass); }
    .arrow.to-a::after { left:  -1px; border-right: 8px solid var(--border-glass); }
  </style>
</head>
<body>
  <div class="frame">
    <div class="card">
      <div class="card-body">
        <div class="wrap">

          <div class="endpoint a">Reactor A<span class="role">polls</span></div>

          <!-- A -> B : A's new operations, plus A's ack of B's -->
          <div class="msg" style="grid-row: 1;">
            <div class="msg-label">poll request</div>
            <div class="chips">
              <span class="chip green">inbox.ack 112</span>
              <span class="chip green dim">inbox.latest 114</span>
            </div>
            <div class="arrow to-b"></div>
          </div>

          <div class="endpoint b">Reactor B<span class="role">answers</span></div>

          <!-- B -> A : B's new operations, plus B's ack of A's -->
          <div class="msg" style="grid-row: 2;">
            <div class="arrow to-a"></div>
            <div class="chips">
              <span class="chip cyan">inbox.ack 45</span>
            </div>
            <div class="msg-label">poll response</div>
          </div>

        </div>
      </div>
    </div>
  </div>
</body>
</html>
