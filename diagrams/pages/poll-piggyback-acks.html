<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <style>
    /* Both mailboxes on both sides, paired so each arrow is horizontal: A's outbox faces
       B's inbox, A's inbox faces B's outbox.

       Colour is reactor identity only — cyan is A, green is B, as everywhere else in the
       deck. The cursors themselves are neutral, so colour never has to mean two things.

       Line style carries the meaning instead: a solid arrow is an ack, which lands and sets
       the opposite cursor (the value repeats across the row). The dashed arrow is latest,
       which crosses but sets nothing — B's outbox.latest is B's own scan watermark, so the
       dashed line stops short of the box rather than touching it. */
    .frame { max-width: 1150px; }
    .card { height: auto; }
    .card-body { flex: none; }

    .wrap {
      display: grid;
      grid-template-columns: 1fr 260px 1fr;
      column-gap: var(--space-lg);
      row-gap: var(--space-lg);
      align-items: center;
    }

    /* the only coloured things on the slide */
    .who { grid-row: 1; font-size: 16px; font-weight: var(--font-weight-bold); text-align: center; }
    .who.a { grid-column: 1; color: var(--accent-cyan); }
    .who.b { grid-column: 3; color: var(--accent-green); }

    .mb {
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      background: rgba(0, 0, 0, 0.25);
      padding: var(--space-sm) var(--space-md) var(--space-md);
    }
    .mb-name {
      font-size: 10px;
      font-weight: var(--font-weight-semibold);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 6px;
    }
    .val {
      display: flex;
      justify-content: space-between;
      gap: var(--space-lg);
      font-family: var(--font-mono, 'SF Mono', 'Fira Code', monospace);
      font-size: 14px;
      line-height: 1.7;
    }
    .val .k { color: var(--text-secondary); }
    .val .v { color: var(--text-primary); font-weight: var(--font-weight-semibold); }

    .hop { grid-column: 2; display: flex; flex-direction: column; align-items: center; gap: var(--space-md); }
    .wire { display: flex; flex-direction: column; align-items: center; gap: 5px; width: 100%; }
    .wire-label {
      font-family: var(--font-mono, 'SF Mono', 'Fira Code', monospace);
      font-size: 12px;
      font-weight: var(--font-weight-semibold);
      color: var(--text-secondary);
    }
    .wire-label .note { color: var(--text-muted); font-weight: var(--font-weight-medium); }

    .arrow { position: relative; width: 100%; height: 2px; background: var(--border-glass); }
    .arrow::after {
      content: '';
      position: absolute; top: 50%;
      transform: translateY(-50%);
      border-top: 5px solid transparent;
      border-bottom: 5px solid transparent;
    }
    .arrow.to-b::after { right: -1px; border-left:  8px solid var(--border-glass); }
    .arrow.to-a::after { left:  -1px; border-right: 8px solid var(--border-glass); }
    /* crosses, but lands on nothing: shorter, dashed, no head */
    .arrow.nowhere {
      width: 62%;
      align-self: flex-start;
      background: none;
      height: 0;
      border-top: 2px dashed var(--border-glass);
      opacity: 0.75;
    }
    .arrow.nowhere::after { content: none; }
  </style>
</head>
<body>
  <div class="frame">
    <div class="card">
      <div class="card-body">
        <div class="wrap">

          <div class="who a">Reactor A</div>
          <div class="who b">Reactor B</div>

          <!-- B's inbox ack comes back on the response and sets A's outbox ack -->
          <div class="mb" style="grid-row: 2; grid-column: 1;">
            <div class="mb-name">outbox</div>
            <div class="val"><span class="k">ack</span><span class="v">45</span></div>
            <div class="val"><span class="k">latest</span><span class="v">48</span></div>
          </div>
          <div class="hop" style="grid-row: 2;">
            <div class="wire">
              <div class="wire-label">ack</div>
              <div class="arrow to-a"></div>
            </div>
          </div>
          <div class="mb" style="grid-row: 2; grid-column: 3;">
            <div class="mb-name">inbox</div>
            <div class="val"><span class="k">ack</span><span class="v">45</span></div>
            <div class="val"><span class="k">latest</span><span class="v">47</span></div>
          </div>

          <!-- A's inbox cursors go out on the request; only the ack lands -->
          <div class="mb" style="grid-row: 3; grid-column: 1;">
            <div class="mb-name">inbox</div>
            <div class="val"><span class="k">ack</span><span class="v">112</span></div>
            <div class="val"><span class="k">latest</span><span class="v">114</span></div>
          </div>
          <div class="hop" style="grid-row: 3;">
            <div class="wire">
              <div class="wire-label">ack</div>
              <div class="arrow to-b"></div>
            </div>
            <div class="wire">
              <div class="wire-label">latest <span class="note">&mdash; filters only</span></div>
              <div class="arrow to-b nowhere"></div>
            </div>
          </div>
          <div class="mb" style="grid-row: 3; grid-column: 3;">
            <div class="mb-name">outbox</div>
            <div class="val"><span class="k">ack</span><span class="v">112</span></div>
            <div class="val"><span class="k">latest</span><span class="v">115</span></div>
          </div>

        </div>
      </div>
    </div>
  </div>
</body>
</html>
