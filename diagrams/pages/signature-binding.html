<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <style>
    /* One action, two possible signatures. The only thing that varies between the default
       and the high-security case is what the signature covers, so the action is drawn once
       and the diagram forks at the signature. */
    .frame { max-width: 900px; }
    .card { height: auto; }
    .card-body { flex: none; }

    .mono { font-family: var(--font-mono, 'SF Mono', 'Fira Code', 'Fira Mono', monospace); }

    .box {
      background: var(--bg-elevated);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-md);
      padding: var(--space-sm) var(--space-lg);
      text-align: center;
    }
    .box.accent-purple { border-color: var(--accent-purple); background: var(--accent-purple-bg); color: var(--accent-purple); }

    /* The action, drawn once */
    .action {
      justify-self: center;
      font-size: 16px;
      font-weight: var(--font-weight-medium);
    }
    .action-row { display: grid; }

    /* Fork: stem down, bar across, one drop into each branch */
    .fork { display: grid; grid-template-columns: 1fr 1fr; }
    .stem {
      grid-column: 1 / 3;
      justify-self: center;
      width: 2px; height: 22px;
      background: var(--text-muted);
    }
    .bar {
      grid-column: 1 / 3;
      height: 2px;
      background: var(--text-muted);
      margin: 0 25%;            /* spans between the two branch centres */
    }
    .drop {
      justify-self: center;
      width: 2px; height: 22px;
      background: var(--text-muted);
      position: relative;
    }
    .drop::after {
      content: '';
      position: absolute;
      bottom: -7px; left: -4px;
      border-left: 5px solid transparent;
      border-right: 5px solid transparent;
      border-top: 8px solid var(--text-muted);
    }

    /* The two signatures */
    .branches {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--space-xl);
      margin-top: var(--space-md);
    }
    .branch {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-sm);
      text-align: center;
    }
    .tag {
      font-size: 12px;
      font-weight: var(--font-weight-semibold);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-muted);
    }
    .sig {
      font-size: 19px;
      font-weight: var(--font-weight-semibold);
      color: var(--text-primary);
      border: 1px solid var(--border-glass);
      background: rgba(0, 0, 0, 0.25);
      border-radius: var(--radius-md);
      padding: var(--space-md) var(--space-lg);
      white-space: nowrap;
    }
    /* the one part that differs */
    .sig .hl { color: var(--accent-cyan); }

    .verdict {
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 8px;
      font-size: 13.5px;
      line-height: 1.45;
      color: var(--text-secondary);
      max-width: 300px;
    }
    .verdict .g { font-size: 16px; font-weight: var(--font-weight-bold); line-height: 1; }
    .verdict.bad  .g { color: #e05252; }
    .verdict.good .g { color: var(--accent-green); }
  </style>
</head>
<body>
  <div class="frame">
    <div class="card">
      <div class="card-body">

        <div class="action-row">
          <div class="box accent-purple action mono">{ type: "SIGN_STATEMENT", payload: &hellip; }</div>
        </div>

        <div class="fork">
          <div class="stem"></div>
          <div class="bar"></div>
          <div class="drop"></div>
          <div class="drop"></div>
        </div>

        <div class="branches">
          <div class="branch">
            <div class="tag">Default</div>
            <div class="sig mono">sig( payload )</div>
            <div class="verdict bad">
              <span class="g">&times;</span>
              <span>Survives reshuffle &mdash; the state can change underneath it</span>
            </div>
          </div>

          <div class="branch">
            <div class="tag">High security</div>
            <div class="sig mono">sig( payload + <span class="hl">H(state)</span> )</div>
            <div class="verdict good">
              <span class="g">&check;</span>
              <span>Rejects on any reshuffle or state change</span>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>
</body>
</html>
