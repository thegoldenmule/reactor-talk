<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <style>
    .frame { max-width: 1100px; }
    .card { height: auto; }
    .card-body { flex: none; gap: var(--space-2xl); }

    .direction {
      display: grid;
      grid-template-columns: 110px 1fr 110px;
      align-items: center;
      gap: var(--space-lg);
    }

    .endpoint {
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-md);
      padding: var(--space-sm) var(--space-md);
      font-size: 13px;
      font-weight: var(--font-weight-semibold);
      text-align: center;
      background: var(--bg-elevated);
    }
    .endpoint.accent-cyan  { border-color: var(--accent-cyan);  background: var(--accent-cyan-bg);  color: var(--accent-cyan); }
    .endpoint.accent-green { border-color: var(--accent-green); background: var(--accent-green-bg); color: var(--accent-green); }
    .endpoint .role {
      display: block;
      font-size: 9px;
      font-weight: var(--font-weight-semibold);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* Number line */
    .line-wrap { position: relative; height: 120px; }
    .line {
      position: absolute;
      left: 0; right: 0; top: 50%;
      height: 2px;
      background: var(--border-glass);
      transform: translateY(-50%);
    }
    .line::after {
      content: '';
      position: absolute;
      right: -1px; top: 50%;
      transform: translateY(-50%);
      border-top: 5px solid transparent;
      border-bottom: 5px solid transparent;
      border-left: 8px solid var(--border-glass);
    }
    /* filled segment: applied (0..ack) and seen-but-pending (ack..latest) */
    .seg {
      position: absolute;
      top: 50%;
      height: 4px;
      transform: translateY(-50%);
      border-radius: 2px;
    }
    .seg.applied.cyan  { background: var(--accent-cyan); }
    .seg.applied.green { background: var(--accent-green); }
    .seg.pending.cyan  { background: var(--accent-cyan);  opacity: 0.3; }
    .seg.pending.green { background: var(--accent-green); opacity: 0.3; }

    .tick {
      position: absolute;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--bg-surface);
      border: 2px solid var(--text-muted);
    }
    .tick-num {
      position: absolute;
      top: calc(50% + 12px);
      transform: translateX(-50%);
      font-size: 10px;
      color: var(--text-muted);
      font-family: var(--font-mono, 'SF Mono', 'Fira Code', monospace);
    }

    /* Cursor markers */
    .cursor {
      position: absolute;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .cursor.above { bottom: calc(50% + 8px); }
    .cursor.below { top: calc(50% + 26px); flex-direction: column-reverse; }
    .cursor-pin {
      width: 2px; height: 14px;
    }
    .cursor-tag {
      font-size: 10px;
      font-weight: var(--font-weight-semibold);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: var(--radius-xs);
      border: 1px solid;
      white-space: nowrap;
      font-family: var(--font-mono, 'SF Mono', 'Fira Code', monospace);
    }
    .cursor.cyan .cursor-pin  { background: var(--accent-cyan); }
    .cursor.cyan .cursor-tag  { color: var(--accent-cyan);  border-color: var(--accent-cyan);  background: var(--accent-cyan-bg); }
    .cursor.green .cursor-pin { background: var(--accent-green); }
    .cursor.green .cursor-tag { color: var(--accent-green); border-color: var(--accent-green); background: var(--accent-green-bg); }
    .cursor.dim .cursor-tag   { opacity: 0.55; }
    .cursor.dim .cursor-pin   { opacity: 0.55; }

    .dir-label {
      font-size: 10px;
      font-weight: var(--font-weight-semibold);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
      text-align: center;
      margin-bottom: var(--space-sm);
    }

    .footer {
      display: flex;
      justify-content: center;
      gap: var(--space-xl);
      margin-top: var(--space-sm);
    }
    .rule {
      font-size: 12px;
      font-weight: var(--font-weight-medium);
      color: var(--text-secondary);
      font-family: var(--font-mono, 'SF Mono', 'Fira Code', monospace);
      padding: var(--space-xs) var(--space-md);
      border: 1px dashed var(--border-glass);
      border-radius: var(--radius-sm);
    }
  </style>
</head>
<body>
  <div class="frame">
    <div class="card">
      <div class="card-body">

        <!-- A → B : A's outbox, B's inbox -->
        <div>
          <div class="dir-label">A → B &nbsp;·&nbsp; A's outbox / B's inbox &nbsp;·&nbsp; A's ordinals</div>
          <div class="direction">
            <div class="endpoint accent-cyan">Reactor A<span class="role">outbox</span></div>
            <div class="line-wrap">
              <div class="line"></div>
              <div class="seg applied cyan" style="left: 0%; width: 55%;"></div>
              <div class="seg pending cyan" style="left: 55%; width: 25%;"></div>
              <div class="tick" style="left: 0%"></div><span class="tick-num" style="left: 0%">0</span>
              <div class="tick" style="left: 55%"></div><span class="tick-num" style="left: 55%">41</span>
              <div class="tick" style="left: 80%"></div><span class="tick-num" style="left: 80%">47</span>
              <div class="cursor cyan above" style="left: 55%">
                <span class="cursor-tag">outbox.ack</span><div class="cursor-pin"></div>
              </div>
              <div class="cursor cyan above dim" style="left: 80%">
                <span class="cursor-tag">outbox.latest</span><div class="cursor-pin"></div>
              </div>
              <div class="cursor green below" style="left: 55%">
                <span class="cursor-tag">inbox.ack</span><div class="cursor-pin"></div>
              </div>
              <div class="cursor green below dim" style="left: 80%">
                <span class="cursor-tag">inbox.latest</span><div class="cursor-pin"></div>
              </div>
            </div>
            <div class="endpoint accent-green">Reactor B<span class="role">inbox</span></div>
          </div>
        </div>


        <div class="footer">
          <span class="rule">ack ≤ latest</span>
          <span class="rule">cursors only move forward</span>
          <span class="rule">synced ⇔ ack == latest</span>
        </div>

      </div>
    </div>
  </div>
</body>
</html>
