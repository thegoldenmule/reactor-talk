<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <style>
    /* One stream of operations, with A's outbox cursors tracked above it and B's inbox
       cursors below. The four land on four different ordinals on purpose — they move
       independently, and the previous version pinned them in pairs, which made them look
       like they had to agree.

       The three tracks share one 8-column template, so a cursor placed in column N sits
       directly over operation N. Every item is placed explicitly; no auto placement. */
    .frame { max-width: 1100px; }
    .card { height: auto; }
    .card-body { flex: none; }

    .wrap {
      display: grid;
      grid-template-columns: 132px 1fr;
      column-gap: var(--space-lg);
      row-gap: var(--space-sm);
      align-items: center;
    }

    .lbl {
      grid-column: 1;
      text-align: right;
      font-size: 14px;
      font-weight: var(--font-weight-semibold);
      white-space: nowrap;
    }
    .lbl.cyan  { color: var(--accent-cyan); }
    .lbl.green { color: var(--accent-green); }
    .lbl.muted { color: var(--text-muted); font-weight: var(--font-weight-medium); }

    .track, .ops {
      grid-column: 2;
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      column-gap: 10px;
    }

    .line {
      grid-column: 1 / -1;
      height: 2px;
      background: var(--border-glass);
      border-radius: 1px;
    }
    .track.top .line { grid-row: 1; }
    .track.top .cur  { grid-row: 2; }
    .track.bottom .cur  { grid-row: 1; }
    .track.bottom .line { grid-row: 2; }

    .cur {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }
    .track.bottom .cur { flex-direction: column-reverse; }
    .tag {
      font-size: 12px;
      font-weight: var(--font-weight-semibold);
      white-space: nowrap;
      line-height: 1.2;
    }
    .pin { width: 2px; height: 13px; border-radius: 1px; }
    .cur.cyan  .tag { color: var(--accent-cyan); }
    .cur.cyan  .pin { background: var(--accent-cyan); }
    .cur.green .tag { color: var(--accent-green); }
    .cur.green .pin { background: var(--accent-green); }
    /* "latest" is the leading edge; "ack" is the settled one, so ack reads solid */
    .cur.ahead .tag { opacity: 0.72; }
    .cur.ahead .pin { opacity: 0.72; }

    .op {
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm, 8px);
      background: rgba(0, 0, 0, 0.25);
      padding: 11px 0;
      text-align: center;
      font-size: 16px;
      font-weight: var(--font-weight-semibold);
      color: var(--text-primary);
    }
  </style>
</head>
<body>
  <div class="frame">
    <div class="card">
      <div class="card-body">
        <div class="wrap">

          <div class="lbl cyan" style="grid-row: 1;">A&rsquo;s outbox</div>
          <div class="track top" style="grid-row: 1;">
            <div class="line"></div>
            <div class="cur cyan"       style="grid-column: 4;"><span class="tag">outbox.ack</span><span class="pin"></span></div>
            <div class="cur cyan ahead" style="grid-column: 8;"><span class="tag">outbox.latest</span><span class="pin"></span></div>
          </div>

          <div class="lbl muted" style="grid-row: 2;">operations</div>
          <div class="ops" style="grid-row: 2;">
            <div class="op">41</div>
            <div class="op">42</div>
            <div class="op">43</div>
            <div class="op">44</div>
            <div class="op">45</div>
            <div class="op">46</div>
            <div class="op">47</div>
            <div class="op">48</div>
          </div>

          <div class="lbl green" style="grid-row: 3;">B&rsquo;s inbox</div>
          <div class="track bottom" style="grid-row: 3;">
            <div class="cur green"       style="grid-column: 5;"><span class="tag">inbox.ack</span><span class="pin"></span></div>
            <div class="cur green ahead" style="grid-column: 7;"><span class="tag">inbox.latest</span><span class="pin"></span></div>
            <div class="line"></div>
          </div>

        </div>
      </div>
    </div>
  </div>
</body>
</html>
