<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <style>
    .frame {
      max-width: 1200px;
    }
    .card {
      height: auto;
    }
    .card-body {
      flex: none;
    }

    /* Three document editors cascaded back-to-front. The stage is sized so the card lands
       close to the deck's 1776x896 art box aspect, so the slide fills without letterboxing.
       Screenshots live in pages/assets/ and are copied into the deck by its build. */
    .stage {
      position: relative;
      width: 1088px;   /* full card content width: 1200 - 48 frame - 64 card */
      height: 494px;
      margin: 0 auto;
    }
    .shot {
      position: absolute;
      width: 560px;
      height: 350px;
      margin: 0;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      background: var(--bg-elevated);
      box-shadow:
        0 28px 64px rgba(0, 0, 0, 0.72),
        0 6px 16px rgba(0, 0, 0, 0.55);
      overflow: hidden;
    }
    .shot img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top left;
    }
    /* Offsets reveal ~47% of each panel behind the one in front of it. */
    .shot:nth-child(1) { left: 0;     top: 0;     z-index: 1; }
    .shot:nth-child(2) { left: 264px; top: 72px;  z-index: 2; }
    .shot:nth-child(3) { left: 528px; top: 144px; z-index: 3; }

    /* Fallback if a screenshot is missing, so the deck still builds and says what it wants. */
    .slot {
      display: none;
      flex-direction: column;
      gap: 6px;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      text-align: center;
      padding: var(--space-md);
      box-sizing: border-box;
      color: var(--text-muted);
      font-size: 12px;
      line-height: 1.5;
    }
    .shot.empty { border-style: dashed; box-shadow: none; }
    .shot.empty img { display: none; }
    .shot.empty .slot { display: flex; }
    .slot code {
      color: var(--text-secondary);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11px;
    }
  </style>
</head>
<body>
  <div class="frame">
    <div class="card">
      <div class="card-body">
        <div class="stage">
          <figure class="shot">
            <img src="assets/document-editor-wiki.png" alt="A knowledge-base note editor" onerror="this.closest('.shot').classList.add('empty')">
            <div class="slot">screenshot slot<code>pages/assets/document-editor-wiki.png</code></div>
          </figure>
          <figure class="shot">
            <img src="assets/document-editor-invoice.png" alt="An invoice document editor" onerror="this.closest('.shot').classList.add('empty')">
            <div class="slot">screenshot slot<code>pages/assets/document-editor-invoice.png</code></div>
          </figure>
          <figure class="shot">
            <img src="assets/document-editor-process.png" alt="An operational hub editor for a business process" onerror="this.closest('.shot').classList.add('empty')">
            <div class="slot">screenshot slot<code>pages/assets/document-editor-process.png</code></div>
          </figure>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
