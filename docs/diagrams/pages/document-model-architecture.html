<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <style>
    .frame {
      max-width: 860px;
    }
    .card {
      height: auto;
      width: auto;
    }
    .card-body {
      gap: var(--space-md);
      flex: none;
    }

    /* Two-column grid with center bridge. The bridge column is a fixed width so the
       PHDocument row below the wrapper can repeat the template and line up exactly. */
    .diagram-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 96px minmax(0, 1fr);
      gap: 0 var(--space-lg);
      align-items: stretch;
    }

    /* Column headers */
    .col-header {
      font-size: 11px;
      font-weight: var(--font-weight-semibold);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding-bottom: var(--space-xs);
      text-align: center;
    }
    .col-header.spec { color: var(--accent-cyan); }
    .col-header.codegen { color: var(--accent-purple); }
    .col-header.reducer { color: var(--accent-blue); }

    /* Vertical column flow */
    .col-spec,
    .col-reducer {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 0;
    }

    /* Center bridge column — empty; the codegen arrow hangs off the types row, which the
       script at the bottom of the page drops onto the spec's centre line. */
    .types-row { position: relative; }
    .types-row .h-arrow {
      position: absolute;
      top: 50%;
      right: calc(100% + var(--space-lg));
      transform: translateY(-50%);
    }

    /* The spec is a state schema AND an action schema, not one leading to the other */
    .spec-plus {
      font-size: 26px;
      font-weight: var(--font-weight-medium);
      line-height: 1;
      color: var(--accent-cyan);
      text-align: center;
      margin: var(--space-sm) 0 var(--space-md);
    }

    /* Box component used in columns */
    .box {
      background: var(--bg-elevated);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-md);
      padding: var(--space-md) var(--space-lg);
      font-size: 13px;
      font-weight: var(--font-weight-medium);
      text-align: center;
    }
    .box.accent-cyan  { border-color: var(--accent-cyan);   background: var(--accent-cyan-bg);   color: var(--accent-cyan); }
    .box.accent-purple { border-color: var(--accent-purple); background: var(--accent-purple-bg); color: var(--accent-purple); }
    .box.accent-blue   { border-color: var(--accent-blue);   background: var(--accent-blue-bg);   color: var(--accent-blue); }
    .box.accent-green  { border-color: var(--accent-green);  background: var(--accent-green-bg);  color: var(--accent-green); }
    /* The reducer is hand-written, not generated, so it does not share the types' colour */
    .box.accent-amber  { border-color: #F59E0B; background: rgba(245, 158, 11, 0.12); color: #F59E0B; }

    .box-title {
      font-size: 14px;
      font-weight: var(--font-weight-semibold);
      margin-bottom: var(--space-xs);
    }

    .box-detail {
      font-size: 12px;
      opacity: 0.75;
      line-height: var(--line-height-normal);
    }

    /* Vertical connector between boxes */
    .v-connector {
      width: 3px;
      height: 20px;
      background: var(--text-primary);
      margin: var(--space-sm) auto var(--space-md) auto;
      position: relative;
    }
    .v-connector-label {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 10px;
      font-weight: var(--font-weight-semibold);
      color: var(--text-muted);
      white-space: nowrap;
      font-family: 'SF Mono', 'Fira Code', monospace;
    }
    .v-connector::after {
      content: '';
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-top: 8px solid var(--text-primary);
    }

    /* Horizontal codegen arrow */
    .h-arrow {
      display: flex;
      align-items: center;
      gap: var(--space-xs);
      white-space: nowrap;
    }
    .h-arrow-line {
      height: 3px;
      width: 16px;
      background: var(--accent-purple);
      position: relative;
    }
    .h-arrow-line.has-head::after {
      content: '';
      position: absolute;
      left: 100%;
      top: 50%;
      transform: translateY(-50%);
      width: 0;
      height: 0;
      border-top: 6px solid transparent;
      border-bottom: 6px solid transparent;
      border-left: 8px solid var(--accent-purple);
    }
    .h-arrow-label {
      font-size: 11px;
      font-weight: var(--font-weight-semibold);
      color: var(--accent-purple);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .model-flow {
      display: flex;
      flex-direction: column;
    }

    /* Document Model wrapper — everything the author writes: the spec and the reducer.
       The PHDocument the reducer produces is deliberately outside it. */
    .dm-wrapper {
      border: 2px dashed var(--text-secondary);
      border-radius: var(--radius-md);
      padding: var(--space-lg) var(--space-md) var(--space-md);
      position: relative;
    }
    .dm-wrapper-label {
      position: absolute;
      top: -10px;
      left: var(--space-md);
      font-size: 12px;
      font-weight: var(--font-weight-bold);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      background: var(--bg-surface);
      padding: 0 var(--space-sm);
      color: var(--text-primary);
    }

    /* Line out of the Reducer: fills whatever column height is left, then punches through
       the wrapper's bottom padding and border on its way to the PHDocument. */
    .lead-out {
      flex: 1 0 var(--space-lg);
      width: 3px;
      background: var(--text-primary);
      margin: var(--space-sm) auto calc(-1 * var(--space-md) - 2px) auto;
    }

    /* PHDocument row — same column template and side padding as the wrapper's content box,
       so its column 3 sits exactly under the reducer column. */
    .ph-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 96px minmax(0, 1fr);
      gap: 0 var(--space-lg);
      border: 0 solid transparent;
      border-left-width: 2px;
      border-right-width: 2px;
      padding: 0 var(--space-md);
    }
    .ph-cell { grid-column: 3; }
    .ph-cell .v-connector { margin-top: 0; }

    /* PHDocument wrapper — dotted border around State + Operations */
    .phdocument-wrapper {
      border: 1px dashed var(--accent-green);
      border-radius: var(--radius-md);
      padding: var(--space-md);
      position: relative;
    }
    .phdocument-wrapper-label {
      position: absolute;
      top: -9px;
      left: var(--space-md);
      font-size: 11px;
      font-weight: var(--font-weight-semibold);
      color: var(--accent-green);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      background: var(--bg-surface);
      padding: 0 var(--space-sm);
    }

    /* The two generated types, side by side */
    .type-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--space-md);
    }
    .type-group .box {
      padding: var(--space-md) var(--space-sm);
    }

    .output-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--space-md);
    }
  </style>
</head>
<body>
  <div class="frame">
    <div class="card">
      <div class="card-body">
       <div class="model-flow">
        <div class="dm-wrapper">
         <span class="dm-wrapper-label">Document Model</span>
         <div class="diagram-grid">

          <!-- Column Headers -->
          <div class="col-header spec">Specification</div>
          <div class="col-header codegen"></div>
          <div class="col-header reducer">Types</div>

          <!-- Left Column: Spec -->
          <div class="col-spec">
            <div class="box accent-cyan">
              <div class="box-title">State Schema</div>
              <div class="box-detail"></div>
            </div>
            <div class="spec-plus" id="specPlus">+</div>
            <div class="box accent-cyan">
              <div class="box-title">Command Schema</div>
              <div class="box-detail">
                
              </div>
            </div>
          </div>

          <!-- Center Bridge: spacing only, the arrow itself sits with the types -->
          <div class="col-bridge"></div>

          <!-- Right Column: Reducer -->
          <div class="col-reducer">
           <div class="types-row" id="typesRow">
            <div class="h-arrow" id="codegenArrow">
              <div class="h-arrow-line"></div>
              <div class="h-arrow-label">Codegen</div>
              <div class="h-arrow-line has-head"></div>
            </div>
            <div class="type-group" id="typeGroup">
              <div class="box accent-blue">
                <div class="box-title">Command</div>
                <div class="box-detail">{ type, input }</div>
              </div>
              <div class="box accent-blue">
                <div class="box-title">State</div>
                <div class="box-detail">{ ... }</div>
              </div>
            </div>
           </div>
            <div class="v-connector"></div>
            <div class="box accent-amber" style="padding: var(--space-lg);">
              <div class="box-title">Reducer</div>
              <div class="box-detail">
                f(state, command) &rarr; (state', operation[])
              </div>
            </div>
            <div class="lead-out"></div>
          </div>

         </div>
        </div>

        <!-- The reducer's output: outside the Document Model border -->
        <div class="ph-row">
          <div class="ph-cell">
            <div class="v-connector"></div>
            <div class="phdocument-wrapper">
              <span class="phdocument-wrapper-label">PHDocument</span>
              <div class="output-group">
                <div class="box accent-green">
                  <div class="box-title">State</div>
                </div>
                <div class="box accent-green">
                  <div class="box-title">Operations</div>
                </div>
              </div>
            </div>
          </div>
        </div>
       </div>
      </div>
    </div>
  </div>
  <script>
    // Codegen turns the spec into the two types and nothing else, so the Command/State row
    // drops onto the centre line of the spec's "+". The arrow rides with that row.
    function placeCodegen() {
      var plus = document.getElementById('specPlus');
      var types = document.getElementById('typeGroup');
      var column = document.querySelector('.col-reducer');

      column.style.marginTop = '0px';
      var drop = centreOf(plus) - centreOf(types);
      if (drop > 0) column.style.marginTop = drop + 'px';

      function centreOf(el) {
        var r = el.getBoundingClientRect();
        return r.top + r.height / 2;
      }
    }

    placeCodegen();
    // Web fonts land after first layout and move everything down, so measure again.
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(placeCodegen);
    window.addEventListener('resize', placeCodegen);
  </script>
</body>
</html>
